<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Списки</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* =====================================================================
       ДИЗАЙН-ТОКЕНЫ
       Белый фон, чёрный текст, жёлтый акцент. Крупные радиусы и «пилюли».
       ===================================================================== */
    :root {
      --accent: #FFD400;
      --accent-soft: #FFF6C7;
      --accent-ink: #3F3600;
      --white: #FFFFFF;
      --ink: #0B0B0C;
      --surface: #F5F5F7;
      --surface-2: #ECECF0;
      --line: #EBEBEF;
      --muted: #8A8A8F;
      --muted-2: #5F5F66;
      --danger: #C74747;
      --danger-soft: #FDECEC;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --pad-x: 18px;
      --shadow-card: 0 1px 2px rgba(12, 12, 16, .04), 0 16px 36px -26px rgba(12, 12, 16, .45);
      --shadow-pop: 0 18px 48px rgba(12, 12, 16, .22);

      /* Безопасные зоны: системные + Telegram (Bot API 8.0+) */
      --safe-top: max(env(safe-area-inset-top, 0px), calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)));
      --safe-bottom: max(env(safe-area-inset-bottom, 0px), calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px)));
      --safe-left: max(env(safe-area-inset-left, 0px), calc(var(--tg-safe-area-inset-left, 0px) + var(--tg-content-safe-area-inset-left, 0px)));
      --safe-right: max(env(safe-area-inset-right, 0px), calc(var(--tg-safe-area-inset-right, 0px) + var(--tg-content-safe-area-inset-right, 0px)));
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scroll-padding-top: calc(var(--safe-top) + 78px);
    }

    body {
      margin: 0;
      background: var(--white);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.4;
      overscroll-behavior-y: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Мягкое жёлтое свечение сверху — не мешает читаемости */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(110% 46% at 100% 0%, #FFF6C7 0%, rgba(255, 246, 199, 0) 62%);
    }

    #app {
      position: relative;
      z-index: 1;
    }

    body.is-locked { overflow: hidden; }

    button, input, textarea, select {
      font: inherit;
      color: inherit;
    }

    button, label[for] { touch-action: manipulation; }

    button { cursor: pointer; }

    button, .menu-card, .chip, .seg, .badge, .topbar, .link-chip, .tool-btn {
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 2px;
    }

    .ic {
      width: 1em;
      height: 1em;
      display: inline-block;
      vertical-align: -.16em;
      flex: none;
      pointer-events: none;
    }

    .hidden { display: none !important; }

    .visually-hidden {
      position: absolute !important;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
      opacity: 0;
      pointer-events: none;
    }

    /* =====================================================================
       КАРКАС
       ===================================================================== */
    .screen {
      max-width: 560px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        0 calc(var(--pad-x) + var(--safe-right))
        calc(56px + var(--safe-bottom))
        calc(var(--pad-x) + var(--safe-left));
    }

    /* =====================================================================
       ГЛАВНЫЙ ЭКРАН
       ===================================================================== */
    .home-head {
      padding: calc(var(--safe-top) + 20px) 2px 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--accent);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 8px 18px -8px rgba(255, 212, 0, .9);
    }

    .brand-name {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted-2);
    }

    .hero {
      margin: 0 0 10px;
      font-size: 36px;
      line-height: 1.07;
      font-weight: 800;
      letter-spacing: -.035em;
      overflow-wrap: anywhere;
    }

    .hero-sub {
      margin: 0;
      font-size: 16.5px;
      color: var(--muted-2);
    }

    .sync-line {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 8px 2px 18px;
      font-size: 12.5px;
      line-height: 1.35;
      color: var(--muted);
    }

    .sync-line::before {
      content: "";
      width: 6px;
      height: 6px;
      flex: none;
      border-radius: 50%;
      background: var(--accent);
    }

    .sync-line.warn::before { background: var(--danger); }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Карточка-пилюля */
    .menu-card {
      display: flex;
      align-items: center;
      gap: 13px;
      width: 100%;
      min-height: 76px;
      padding: 11px 14px 11px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--white);
      box-shadow: var(--shadow-card);
      text-align: left;
      transition: transform .16s ease, background .16s ease, box-shadow .16s ease;
    }

    .menu-card:active {
      transform: scale(.985);
      background: #FCFCFD;
      box-shadow: none;
    }

    .menu-icon {
      width: 48px;
      height: 48px;
      flex: none;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 23px;
    }

    .menu-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .menu-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -.012em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .menu-sub {
      font-size: 13px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .badge {
      flex: none;
      min-width: 28px;
      height: 28px;
      padding: 0 9px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--white);
      font-size: 13px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .chev {
      flex: none;
      display: flex;
      color: #C5C5CB;
      font-size: 18px;
    }

    /* =====================================================================
       ВЕРХНЯЯ ПАНЕЛЬ ЭКРАНА СПИСКА
       ===================================================================== */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 calc(-1 * (var(--pad-x) + var(--safe-right))) 0 calc(-1 * (var(--pad-x) + var(--safe-left)));
      padding:
        calc(var(--safe-top) + 10px)
        calc(var(--pad-x) + var(--safe-right))
        10px
        calc(var(--pad-x) + var(--safe-left));
      background: rgba(255, 255, 255, .88);
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
    }

    .round-btn {
      width: 44px;
      height: 44px;
      flex: none;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .14s ease, background .14s ease;
    }

    .round-btn:active {
      transform: scale(.93);
      background: var(--surface-2);
    }

    .topbar-title {
      flex: 1;
      min-width: 0;
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.025em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .count-pill {
      flex: none;
      min-width: 34px;
      height: 30px;
      padding: 0 11px;
      border-radius: 999px;
      background: var(--ink);
      color: var(--white);
      font-size: 13px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .count-pill.zero {
      background: var(--surface);
      color: var(--muted);
    }

    .section-sub {
      margin: 2px 4px 18px;
      font-size: 16px;
      color: var(--muted-2);
    }

    /* Подсказка про бота */
    .tip {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      margin: 2px 0 12px;
      padding: 11px 14px;
      border-radius: 18px;
      background: var(--accent-soft);
      color: var(--accent-ink);
      font-size: 13.5px;
      line-height: 1.38;
    }

    .tip .ic {
      margin-top: 1px;
      font-size: 17px;
    }

    /* =====================================================================
       ФОРМА ДОБАВЛЕНИЯ
       ===================================================================== */
    .composer {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 2px 0 16px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--white);
      box-shadow: var(--shadow-card);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .label {
      padding-left: 4px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--muted-2);
    }

    input,
    textarea,
    select {
      width: 100%;
      min-height: 50px;
      padding: 12px 14px;
      border: 1.5px solid transparent;
      border-radius: 16px;
      background: var(--surface);
      color: var(--ink);
      font-size: 17px;
      line-height: 1.35;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
      transition: border-color .16s ease, background .16s ease, box-shadow .16s ease;
    }

    input::placeholder,
    textarea::placeholder { color: #A3A3A9; }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--ink);
      background: var(--white);
    }

    textarea {
      resize: none;
      overflow: hidden;
    }

    .composer #fText {
      min-height: 56px;
      padding: 14px 16px;
      font-size: 17px;
    }

    input[type="date"] {
      display: block;
      line-height: normal;
      text-align: left;
    }

    input[type="date"]::-webkit-date-and-time-value { text-align: left; }

    input[type="number"] { -moz-appearance: textfield; }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .select-wrap { position: relative; }

    .select-wrap select { padding-right: 42px; }

    .select-wrap::after {
      content: "";
      position: absolute;
      right: 18px;
      top: 50%;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }

    .date-row {
      display: flex;
      gap: 8px;
    }

    .date-row input { flex: 1; min-width: 0; }

    .date-clear {
      flex: none;
      min-height: 50px;
      padding: 0 15px;
      border: 0;
      border-radius: 16px;
      background: var(--surface);
      color: var(--muted-2);
      font-size: 14px;
      font-weight: 700;
    }

    .preview {
      position: relative;
      align-self: flex-start;
    }

    .preview img {
      display: block;
      max-width: 160px;
      max-height: 160px;
      border-radius: 18px;
      border: 1px solid var(--line);
    }

    .preview-remove {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 2px solid var(--white);
      border-radius: 999px;
      background: var(--ink);
      color: var(--white);
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .composer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 2px;
    }

    .tool-btn {
      width: 48px;
      height: 48px;
      flex: none;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 21px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform .14s ease, background .14s ease;
    }

    .tool-btn:active { transform: scale(.93); }

    .tool-btn.listening {
      background: var(--accent);
      animation: pulse 1.4s ease-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 212, 0, .55); }
      50% { box-shadow: 0 0 0 9px rgba(255, 212, 0, 0); }
    }

    .add-btn {
      flex: 1;
      min-height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--ink);
      font-size: 16px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: transform .14s ease, filter .14s ease;
    }

    .add-btn:active {
      transform: scale(.98);
      filter: brightness(.97);
    }

    .add-btn .ic { font-size: 18px; }

    /* =====================================================================
       ПОИСК И ФИЛЬТРЫ
       ===================================================================== */
    .list-tools {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 0 0 14px;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 48px;
      padding: 0 15px;
      border: 1.5px solid transparent;
      border-radius: 999px;
      background: var(--surface);
      transition: border-color .16s ease, background .16s ease;
    }

    .search:focus-within {
      border-color: var(--ink);
      background: var(--white);
    }

    .search > .ic {
      font-size: 18px;
      color: var(--muted);
    }

    .search input,
    .search input:focus {
      flex: 1;
      min-width: 0;
      height: 100%;
      min-height: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      font-size: 16px;
      outline: none;
    }

    .search input::-webkit-search-cancel-button { -webkit-appearance: none; }

    .segmented {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 999px;
      background: var(--surface);
    }

    .seg {
      flex: 1;
      min-height: 42px;
      padding: 0 8px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted-2);
      font-size: 13.5px;
      font-weight: 700;
      white-space: nowrap;
      transition: background .16s ease, color .16s ease, box-shadow .16s ease;
    }

    .seg.active {
      background: var(--white);
      color: var(--ink);
      box-shadow: 0 2px 10px rgba(12, 12, 16, .08);
    }

    /* =====================================================================
       ИТОГИ ПО ЦЕНАМ
       ===================================================================== */
    .total {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 14px;
    }

    .total-item {
      flex: 1;
      min-width: 128px;
      padding: 12px 16px;
      border-radius: 20px;
      background: var(--ink);
      color: var(--white);
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .total-item.fact {
      background: var(--accent);
      color: var(--ink);
    }

    .total-label {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .58);
    }

    .total-item.fact .total-label { color: rgba(0, 0, 0, .48); }

    .total-value {
      font-size: 18px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      overflow-wrap: anywhere;
    }

    /* =====================================================================
       ЗАПИСИ
       ===================================================================== */
    .items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      padding: 12px 12px 10px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--white);
      box-shadow: var(--shadow-card);
    }

    .item.editing {
      display: block;
      padding: 16px;
      border-color: var(--ink);
    }

    .item.no-check { padding-left: 16px; }

    .check {
      flex: none;
      width: 44px;
      height: 44px;
      margin: -2px 0 0 -2px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .check .box {
      width: 28px;
      height: 28px;
      border: 2px solid #D6D6DC;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: transform .14s ease, background .14s ease, border-color .14s ease;
    }

    .item.done .check .box {
      background: var(--accent);
      border-color: var(--accent);
    }

    .check:active .box { transform: scale(.88); }

    .item-main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 2px;
    }

    .item.no-check .item-main { padding-top: 1px; }

    .item-text {
      font-size: 16.5px;
      line-height: 1.42;
      letter-spacing: -.005em;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .item-text.clamp {
      display: -webkit-box;
      -webkit-line-clamp: 7;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .more-btn {
      align-self: flex-start;
      margin-top: -3px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--muted-2);
      font-size: 13px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      max-width: 100%;
      padding: 6px 11px;
      border-radius: 999px;
      background: var(--surface);
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 600;
      line-height: 1.2;
    }

    .chip .ic {
      font-size: 14px;
      color: var(--muted-2);
    }

    .chip.accent {
      background: var(--accent-soft);
      font-weight: 800;
    }

    .chip.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .chip.danger .ic { color: var(--danger); }

    .item-comment {
      margin: 0;
      font-size: 14.5px;
      line-height: 1.4;
      color: var(--muted-2);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .link-chip {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      max-width: 100%;
      min-height: 40px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--white);
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 600;
    }

    .link-chip .ic {
      font-size: 14px;
      color: var(--muted-2);
    }

    .link-chip span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .thumb {
      align-self: flex-start;
      padding: 0;
      border: 0;
      background: none;
      border-radius: 18px;
    }

    .thumb img {
      display: block;
      width: 84px;
      height: 84px;
      object-fit: cover;
      border-radius: 18px;
      border: 1px solid var(--line);
    }

    .item.done .thumb img { opacity: .55; }

    .fact-row {
      display: flex;
      gap: 8px;
      margin-top: 1px;
    }

    .mini-field {
      flex: 1;
      min-width: 0;
