<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <title>Списки</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ===== Базовые переменные: белый, чёрный, один жёлтый акцент и серые оттенки ===== */
    :root {
      --accent: #FFD400;
      --white: #FFFFFF;
      --black: #000000;
      --g-bg: #F3F3F3;      /* серый фон второстепенных кнопок */
      --g-line: #E3E3E3;    /* серые рамки карточек */
      --g-border: #CCCCCC;  /* рамки полей ввода */
      --g-text: #7A7A7A;    /* второстепенный текст */
      --g-dark: #4A4A4A;    /* тёмно-серый текст */

      /* Safe-area: системные отступы + отступы Telegram (Bot API 8.0+) */
      --safe-top: max(env(safe-area-inset-top, 0px), calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)));
      --safe-bottom: max(env(safe-area-inset-bottom, 0px), calc(var(--tg-safe-area-inset-bottom, 0px) + var(--tg-content-safe-area-inset-bottom, 0px)));
      --safe-left: max(env(safe-area-inset-left, 0px), calc(var(--tg-safe-area-inset-left, 0px) + var(--tg-content-safe-area-inset-left, 0px)));
      --safe-right: max(env(safe-area-inset-right, 0px), calc(var(--tg-safe-area-inset-right, 0px) + var(--tg-content-safe-area-inset-right, 0px)));
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      background: var(--white);
      color: var(--black);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 17px;
      line-height: 1.4;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: none;
    }

    .hidden { display: none !important; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      pointer-events: none;
    }

    /* ===== Экран ===== */
    .screen {
      max-width: 560px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 0 calc(16px + var(--safe-right)) calc(40px + var(--safe-bottom)) calc(16px + var(--safe-left));
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--white);
      padding: calc(var(--safe-top) + 8px) 0 8px;
    }

    .home-header { position: static; padding-bottom: 0; }

    h1 {
      font-size: 30px;
      font-weight: 800;
      line-height: 1.2;
      margin: 6px 0 8px;
    }

    .greet {
      font-size: 19px;
      color: var(--g-dark);
      margin: 0 0 20px;
    }

    .hint {
      font-size: 16px;
      color: var(--g-text);
      margin: 0 0 16px;
    }

    /* ===== Кнопки ===== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 52px;
      padding: 0 18px;
      border: none;
      border-radius: 14px;
      background: var(--g-bg);
      color: var(--black);
      font: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      text-decoration: none;
    }

    .btn:active { opacity: 0.7; }

    .btn.primary {
      width: 100%;
      min-height: 56px;
      background: var(--accent);
      font-size: 18px;
      font-weight: 800;
    }

    .btn.small {
      min-height: 48px;
      padding: 0 14px;
      font-size: 16px;
    }

    .btn.tool { flex: 1; }
    .btn.tool.listening { background: var(--accent); }

    .back-btn { padding: 0 16px 0 12px; }

    /* ===== Карточки меню ===== */
    .menu-card {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      min-height: 78px;
      padding: 14px 16px;
      margin-bottom: 12px;
      border: 1.5px solid var(--g-line);
      border-radius: 18px;
      background: var(--white);
      color: var(--black);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .menu-card:active { background: var(--g-bg); }

    .menu-icon {
      flex: none;
      width: 44px;
      font-size: 32px;
      text-align: center;
    }

    .menu-title {
      flex: 1;
      font-size: 19px;
      font-weight: 700;
    }

    .badge {
      flex: none;
      min-width: 38px;
      height: 38px;
      padding: 0 10px;
      border-radius: 19px;
      background: var(--black);
      color: var(--white);
      font-size: 17px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .badge.zero {
      background: var(--g-bg);
      color: var(--g-text);
    }

    /* ===== Форма добавления ===== */
    .add-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 6px 0 20px;
      padding: 14px;
      border: 1.5px solid var(--g-line);
      border-radius: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .label {
      font-size: 16px;
      font-weight: 600;
      color: var(--g-text);
    }

    input, textarea, select {
      width: 100%;
      min-height: 52px;
      padding: 13px 14px;
      border: 1.5px solid var(--g-border);
      border-radius: 12px;
      background: var(--white);
      color: var(--black);
      font: inherit;
      font-size: 17px;
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    textarea {
      min-height: 84px;
      resize: none;
      overflow: hidden;
      line-height: 1.4;
    }

    input:focus, textarea:focus, select:focus { border-color: var(--black); }

    input::placeholder, textarea::placeholder { color: var(--g-text); }

    input[type="date"] { display: block; }
    input[type="date"]::-webkit-date-and-time-value { text-align: left; }

    .select-wrap { position: relative; }

    .select-wrap select { padding-right: 44px; }

    .select-wrap::after {
      content: "▾";
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--g-text);
      pointer-events: none;
      font-size: 18px;
    }

    .date-row {
      display: flex;
      gap: 8px;
    }

    .date-row input {
      flex: 1;
      min-width: 0;
    }

    .tools {
      display: flex;
      gap: 10px;
    }

    .preview {
      position: relative;
      align-self: flex-start;
      margin-top: 6px;
    }

    .preview img {
      display: block;
      max-width: 160px;
      max-height: 160px;
      border: 1px solid var(--g-line);
      border-radius: 12px;
    }

    .preview-remove {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 44px;
      height: 44px;
      border: 2px solid var(--white);
      border-radius: 22px;
      background: var(--black);
      color: var(--white);
      font-size: 18px;
      cursor: pointer;
    }

    /* ===== Список ===== */
    .total {
      margin: 0 4px 12px;
      font-size: 17px;
      font-weight: 700;
    }

    .group-title {
      margin: 22px 4px 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--g-text);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .item {
      display: flex;
      align-items: flex-start;
      gap: 4px;
      margin-bottom: 10px;
      padding: 8px 4px 12px;
      border: 1.5px solid var(--g-line);
      border-radius: 16px;
      background: var(--white);
    }

    .check {
      flex: none;
      width: 52px;
      height: 52px;
      padding: 0;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .check .box {
      width: 32px;
      height: 32px;
      border: 2.5px solid var(--black);
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: var(--black);
    }

    .item.done .check .box {
      background: var(--accent);
      border-color: var(--accent);
    }

    .item-body {
      flex: 1;
      min-width: 0;
      padding-top: 13px;
    }

    .item-text {
      font-size: 17px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .item-line {
      margin-top: 4px;
      font-size: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .muted { color: var(--g-dark); }

    .item-date {
      margin-top: 6px;
      font-size: 16px;
      color: var(--g-text);
    }

    .item.done .item-text,
    .item.done .item-line {
      text-decoration: line-through;
      color: var(--g-text);
    }

    .thumb {
      display: block;
      margin-top: 8px;
      padding: 0;
      border: none;
      background: none;
      cursor: zoom-in;
    }

    .thumb img {
      display: block;
      width: 96px;
      height: 96px;
      object-fit: cover;
      border: 1px solid var(--g-line);
      border-radius: 12px;
    }

    .item.done .thumb img { opacity: 0.5; }

    .item-actions {
      flex: none;
      display: flex;
      flex-direction: column;
    }

    .icon-btn {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: transparent;
      font-size: 22px;
      cursor: pointer;
    }

    .icon-btn:active { background: var(--g-bg); }

    .date-edit {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .date-edit input { flex: 1 1 100%; }
    .date-edit .btn { flex: 1; }

    .empty {
      padding: 40px 16px;
      text-align: center;
      font-size: 17px;
      color: var(--g-text);
    }

    /* ===== Просмотр картинки ===== */
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--safe-top) + 68px) 12px calc(var(--safe-bottom) + 24px);
      background: rgba(0, 0, 0, 0.94);
    }

    .viewer img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
    }

    .viewer-close {
      position: absolute;
      top: calc(var(--safe-top) + 10px);
      right: calc(14px + var(--safe-right));
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 24px;
      background: var(--white);
      color: var(--black);
      font-size: 22px;
      cursor: pointer;
    }

    /* ===== Тост ===== */
    .toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: calc(var(--safe-bottom) + 16px);
      z-index: 200;
      max-width: 528px;
      margin: 0 auto;
      padding: 12px 12px 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 14px;
      background: var(--black);
      color: var(--white);
      font-size: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
    }

    .toast-text { flex: 1; }

    .toast-action {
      flex: none;
      min-height: 44px;
      padding: 0 14px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: var(--black);
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Полноэкранный просмотр картинки -->
  <div id="viewer" class="viewer hidden" role="dialog" aria-label="Просмотр картинки">
    <button id="viewerClose" class="viewer-close" type="button" aria-label="Закрыть">✕</button>
    <img id="viewerImg" alt="Картинка">
  </div>

  <!-- Всплывающее уведомление -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite">
    <span id="toastText" class="toast-text"></span>
    <button id="toastAction" class="toast-action hidden" type="button"></button>
  </div>

  <script>
    'use strict';

    /* =====================================================================
       КОНСТАНТЫ И НАСТРОЙКИ
       ===================================================================== */

    const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

    const STORAGE_KEY = 'lists_app_v1';
    const LIST_KEYS = ['buy_foodcity', 'buy_shops', 'ideas', 'watch', 'places', 'tasks'];
    const SOURCES = ['Instagram', 'Интернет', 'Друзья\\коллеги', 'Другое'];

    const IMAGE_MAX_WIDTH = 800;   // ширина после сжатия
    const IMAGE_MAX_HEIGHT = 2000; // ограничение для очень длинных скриншотов
    const IMAGE_QUALITY = 0.7;     // качество JPEG

    /* Настройки экранов списков */
    const SECTIONS = {
      buy_foodcity: {
        title: 'Фудсити', icon: '🛒', parent: 'buy',
        textLabel: 'Продукты', placeholder: 'Например: картошка, яблоки, зелень',
        price: true, comment: true, emptyRequired: 'Укажите продукты'
      },
      buy_shops: {
        title: 'Просто магазины', icon: '🏬', parent: 'buy',
        textLabel: 'Продукты', placeholder: 'Например: молоко, хлеб',
        price: true, shop: true, comment: true, emptyRequired: 'Укажите продукты'
      },
      ideas: {
        title: 'Идеи', icon: '💡', parent: 'home',
        textLabel: 'Идея', placeholder: 'Запиши идею…', emptyRequired: 'Введите текст'
      },
      watch: {
        title: 'Что смотреть', icon: '🎬', parent: 'home',
        textLabel: 'Название / описание', placeholder: 'Фильм, сериал, видео…',
        doneLabel: 'посмотрел', emptyRequired: 'Введите название'
      },
      places: {
        title: 'Рестораны/события', icon: '📍', parent: 'home',
        textLabel: 'Название', placeholder: 'Ресторан, выставка, концерт…',
        source: true, emptyRequired: 'Введите название'
      },
      tasks: {
        title: 'Дела/задачи', icon: '✅', parent: 'home',
        textLabel: 'Задача', placeholder: 'Что нужно сделать?',
        date: true, emptyRequired: 'Введите задачу'
      }
    };

    /* Карточки главного экрана */
    const HOME_CARDS = [
      { action: 'open-buy',  key: '',       icon: '🛒', title: 'Что купить',        keys: ['buy_foodcity', 'buy_shops'] },
      { action: 'open-list', key: 'ideas',  icon: '💡', title: 'Идеи',              keys: ['ideas'] },
      { action: 'open-list', key: 'watch',  icon: '🎬', title: 'Что смотреть',      keys: ['watch'] },
      { action: 'open-list', key: 'places', icon: '📍', title: 'Рестораны/события', keys: ['places'] },
      { action: 'open-list', key: 'tasks',  icon: '✅', title: 'Дела/задачи',       keys: ['tasks'] }
    ];

    /* Карточки подраздела «Что купить» */
    const BUY_CARDS = [
      { action: 'open-list', key: 'buy_foodcity', icon: '🛒', title: 'Фудсити',         keys: ['buy_foodcity'] },
      { action: 'open-list', key: 'buy_shops',    icon: '🏬', title: 'Просто магазины', keys: ['buy_shops'] }
    ];

    /* Распознавание речи */
    const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition || null;
    const voiceSupported = !!SpeechRecognitionAPI;

    /* =====================================================================
       СОСТОЯНИЕ
       ===================================================================== */

    let data = loadData();
    let route = { name: 'home' };          // home | buy | list(key)
    let form = { image: null, processing: false };
    let editingDateId = null;              // id задачи, у которой открыт редактор даты
    let viewerOpen = false;
    let recognition = null;
    let listening = false;
    let toastTimer = null;
    let toastActionHandler = null;

    const app = document.getElementById('app');
    const viewer = document.getElementById('viewer');
    const viewerImg = document.getElementById('viewerImg');
    const toastEl = document.getElementById('toast');
    const toastTextEl = document.getElementById('toastText');
    const toastActionEl = document.getElementById('toastAction');

    /* =====================================================================
       УТИЛИТЫ
       ===================================================================== */

    const $ = (sel) => document.querySelector(sel);

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    /* Локальная дата в формате YYYY-MM-DD */
    function toISODate(d) {
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function todayISO() {
      return toISODate(new Date());
    }

    function tomorrowISO() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      return toISODate(d);
    }

    function formatCreated(ts) {
      const d = new Date(ts);
      return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function formatDue(iso) {
      const parts = iso.split('-').map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      const opts = { weekday: 'short', day: 'numeric', month: 'long' };
      if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
      return d.toLocaleDateString('ru-RU', opts);
    }

    function formatPrice(value) {
      return Number(value).toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' ₽';
    }

    function isValidImage(src) {
      return typeof src === 'string' && src.indexOf('data:image/') === 0;
    }

    function versionAtLeast(v) {
      try {
        return !!(tg && typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast(v));
      } catch (e) {
        return false;
      }
    }

    function haptic(type) {
      if (!versionAtLeast('6.1') || !tg.HapticFeedback) return;
      try {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred('light');
      } catch (e) { /* вибро недоступно — игнорируем */ }
    }

    function getFirstName() {
      try {
        const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
        return user && user.first_name ? String(user.first_name) : '';
      } catch (e) {
        return '';
      }
    }

    /* =====================================================================
       ХРАНИЛИЩЕ (localStorage)
       ===================================================================== */

    function loadData() {
      let parsed = {};
      try {
        parsed = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (e) {
        parsed = {};
      }
      if (typeof parsed !== 'object' || parsed === null) parsed = {};
      LIST_KEYS.forEach((k) => {
        if (!Array.isArray(parsed[k])) parsed[k] = [];
      });
      return parsed;
    }

    function isQuotaError(e) {
      return !!e && (
        e.name === 'QuotaExceededError' ||
        e.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
        e.code === 22 ||
        e.code === 1014
      );
    }

    function saveData() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        return true;
      } catch (e) {
        if (isQuotaError(e)) {
          showToast('Память заполнена. Удалите старые записи или картинки.', null, null, 5000);
        } else {
          showToast('Не удалось сохранить данные на устройстве', null, null, 5000);
        }
        return false;
      }
    }

    /* Изменение данных с откатом, если сохранение не удалось */
    function mutate(fn) {
      const backup = JSON.stringify(data);
      fn();
      if (!saveData()) {
        data = JSON.parse(backup);
        return false;
      }
      return true;
    }

    function findItem(key, id) {
      return data[key].find((i) => i.id === id) || null;
    }

    function activeCount(keys) {
      return keys.reduce((sum, k) => sum + data[k].filter((i) => !i.done).length, 0);
    }

    /* =====================================================================
       НАВИГАЦИЯ
       ===================================================================== */

    function navigate(newRoute) {
      abortVoice();
      editingDateId = null;
      form = { image: null, processing: false };
      route = newRoute;
      render();
      window.scrollTo(0, 0);
    }

    function goBack() {
      if (viewerOpen) {
        closeViewer();
        return;
      }
      if (route.name === 'list') {
        const parent = SECTIONS[route.key].parent;
        navigate(parent === 'buy' ? { name: 'buy' } : { name: 'home' });
      } else if (route.name === 'buy') {
        navigate({ name: 'home' });
      }
    }

    function updateBackButton() {
      if (!versionAtLeast('6.1') || !tg.BackButton) return;
      try {
        if (route.name !== 'home' || viewerOpen) tg.BackButton.show();
        else tg.BackButton.hide();
      } catch (e) { /* игнорируем */ }
    }

    /* =====================================================================
       РЕНДЕР ЭКРАНОВ
       ===================================================================== */

    function render() {
      if (route.name === 'home') {
        app.innerHTML = renderHome();
      } else if (route.name === 'buy') {
        app.innerHTML = renderBuy();
      } else {
        app.innerHTML = renderListScreen(route.key);
        renderItems();
      }
      updateBackButton();
    }

    function menuCardHTML(card) {
      const n = activeCount(card.keys);
      return `
        <button class="menu-card" type="button" data-action="${card.action}" data-key="${card.key}">
          <span class="menu-icon" aria-hidden="true">${card.icon}</span>
          <span class="menu-title">${esc(card.title)}</span>
          <span class="badge ${n ? '' : 'zero'}" aria-label="Активных: ${n}">${n}</span>
        </button>`;
    }

    function headerHTML() {
      return `
        <header class="header">
          <button class="btn back-btn" type="button" data-action="back">← Назад</button>
        </header>`;
    }

    function renderHome() {
      const name = getFirstName();
      const greet = name ? 'Привет, ' + esc(name) + '!' : 'Привет!';
      return `
        <div class="screen">
          <header class="header home-header"><h1>Списки</h1></header>
          <p class="greet">${greet}</p>
          ${HOME_CARDS.map(menuCardHTML).join('')}
        </div>`;
    }

    function renderBuy() {
      return `
        <div class="screen">
          ${headerHTML()}
          <h1>🛒 Что купить</h1>
          <p class="hint">Выбери, где будешь покупать</p>
          ${BUY_CARDS.map(menuCardHTML).join('')}
        </div>`;
    }

    function renderListScreen(key) {
      const s = SECTIONS[key];
      const sourceOptions = ['<option value="">Не указано</option>']
        .concat(SOURCES.map((src) => `<option value="${esc(src)}">${esc(src)}</option>`))
        .join('');

      return `
        <div class="screen">
          ${headerHTML()}
          <h1>${s.icon} ${esc(s.title)}</h1>

          <form class="add-form" id="addForm" autocomplete="off" novalidate>
            <label class="field">
              <span class="label">${esc(s.textLabel)}</span>
              <textarea id="fText" rows="2" placeholder="${esc(s.placeholder)}"></textarea>
            </label>

            ${s.price ? `
            <label class="field">
              <span class="label">Цена, ₽</span>
              <input id="fPrice" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0">
            </label>` : ''}

            ${s.shop ? `
            <label class="field">
              <span class="label">Магазин</span>
              <input id="fShop" type="text" placeholder="Например: Пятёрочка">
            </label>` : ''}

            ${s.comment ? `
            <label class="field">
              <span class="label">Комментарий</span>
              <textarea id="fComment" rows="2" placeholder="Необязательно"></textarea>
            </label>` : ''}

            ${s.source ? `
            <label class="field">
              <span class="label">Кто посоветовал</span>
              <span class="select-wrap"><select id="fSource">${sourceOptions}</select></span>
            </label>` : ''}

            ${s.date ? `
            <div class="field">
              <label class="label" for="fDate">Дата (необязательно)</label>
              <div class="date-row">
                <input id="fDate" type="date">
                <button class="btn small" type="button" data-action="clear-form-date">Без даты</button>
              </div>
            </div>` : ''}

            <div class="preview hidden" id="fPreview">
              <img id="fPreviewImg" alt="Прикреплённая картинка">
              <button class="preview-remove" type="button" data-action="remove-form-image" aria-label="Убрать картинку">✕</button>
            </div>

            <div class="tools">
              ${voiceSupported ? `<button class="btn tool" type="button" id="voiceBtn" data-action="voice">🎤 Голосом</button>` : ''}
              <label class="btn tool" for="fImage">📷 Картинка</label>
              <input id="fImage" class="visually-hidden" type="file" accept="image/*">
            </div>

            <button class="btn primary" type="submit">Добавить</button>
          </form>

          ${s.price ? '<div class="total hidden" id="total"></div>' : ''}
          <div id="items"></div>
        </div>`;
    }

    /* Текст срока у задачи */
    function dueText(item) {
      if (!item.date) return '📅 Без даты';
      const overdue = !item.done && item.date < todayISO();
      return '📅 ' + formatDue(item.date) + (overdue ? ' · просрочено' : '');
    }

    function itemHTML(item, key) {
      const s = SECTIONS[key];
      const doneLabel = s.doneLabel || 'выполнено';
      const lines = [];

      if (item.text) lines.push(`<div class="item-text">${esc(item.text)}</div>`);
      if (s.price && item.price !== null && item.price !== undefined && item.price !== '') {
        lines.push(`<div class="item-line"><b>💰 ${esc(formatPrice(item.price))}</b></div>`);
      }
      if (s.shop && item.shop) lines.push(`<div class="item-line">🏪 ${esc(item.shop)}</div>`);
      if (s.comment && item.comment) lines.push(`<div class="item-line muted">💬 ${esc(item.comment)}</div>`);
      if (s.source && item.source) lines.push(`<div class="item-line">👤 Посоветовал: ${esc(item.source)}</div>`);
      if (s.date) lines.push(`<div class="item-line due-line">${esc(dueText(item))}</div>`);
      if (isValidImage(item.image)) {
        lines.push(`<button class="thumb" type="button" data-action="view-image" aria-label="Открыть картинку"><img src="${esc(item.image)}" alt="Картинка" loading="lazy"></button>`);
      }
      lines.push(`<div class="item-date">Создано: ${esc(formatCreated(item.created))}</div>`);

      if (s.date && editingDateId === item.id) {
        lines.push(`
          <div class="date-edit">
            <input class="date-edit-input" type="date" value="${esc(item.date || '')}" aria-label="Дата задачи">
            <button class="btn small" type="button" data-action="clear-date">Без даты</button>
            <button class="btn small" type="button" data-action="close-date">Готово</button>
          </div>`);
      }

      return `
        <div class="item ${item.done ? 'done' : ''}" data-id="${esc(item.id)}">
          <button class="check" type="button" data-action="toggle" role="checkbox"
                  aria-checked="${item.done ? 'true' : 'false'}" aria-label="Отметить: ${esc(doneLabel)}">
            <span class="box">${item.done ? '✓' : ''}</span>
          </button>
          <div class="item-body">${lines.join('')}</div>
          <div class="item-actions">
            ${s.date ? `<button class="icon-btn" type="button" data-action="edit-date" aria-label="Изменить дату">📅</button>` : ''}
            <button class="icon-btn" type="button" data-action="delete" aria-label="Удалить">🗑</button>
          </div>
        </div>`;
    }

    /* Сортировка: невыполненные сверху (новые выше), выполненные снизу */
    function sortItems(arr) {
      return arr.slice().sort((a, b) => (Number(a.done) - Number(b.done)) || (b.created - a.created));
    }

    function renderItems() {
      const container = document.getElementById('items');
      if (!container || route.name !== 'list') return;

      const key = route.key;
      const s = SECTIONS[key];
      const items = data[key];

      /* Итог по ценам для покупок */
      if (s.price) {
        const totalEl = document.getElementById('total');
        const sum = items
          .filter((i) => !i.done && typeof i.price === 'number' && !Number.isNaN(i.price))
          .reduce((acc, i) => acc + i.price, 0);
        if (totalEl) {
          totalEl.textContent = 'Итого к покупке: ' + formatPrice(sum);
          totalEl.classList.toggle('hidden', sum <= 0);
        }
      }

      if (!items.length) {
        container.innerHTML = '<div class="empty">Пока пусто — добавь первую запись</div>';
        return;
      }

      if (!s.date) {
        container.innerHTML = sortItems(items).map((i) => itemHTML(i, key)).join('');
        return;
      }

      /* Группировка задач */
      const today = todayISO();
      const tomorrow = tomorrowISO();
      const groups = { today: [], tomorrow: [], later: [], nodate: [], done: [] };

      items.forEach((item) => {
        if (item.done) groups.done.push(item);
        else if (!item.date) groups.nodate.push(item);
        else if (item.date <= today) groups.today.push(item);   // просроченные тоже в «Сегодня»
        else if (item.date === tomorrow) groups.tomorrow.push(item);
        else groups.later.push(item);
      });

      const byDate = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : b.created - a.created);
      const byCreated = (a, b) => b.created - a.created;
      groups.today.sort(byDate);
      groups.tomorrow.sort(byCreated);
      groups.later.sort(byDate);
      groups.nodate.sort(byCreated);
      groups.done.sort(byCreated);

      const order = [
        ['today', 'Сегодня'],
        ['tomorrow', 'Завтра'],
        ['later', 'Позже'],
        ['nodate', 'Без даты'],
        ['done', 'Выполнено']
      ];

      container.innerHTML = order
        .filter(([g]) => groups[g].length)
        .map(([g, title]) => `<div class="group-title">${title}</div>` +
          groups[g].map((i) => itemHTML(i, key)).join(''))
        .join('');
    }

    /* =====================================================================
       ДЕЙСТВИЯ СО СПИСКОМ
       ===================================================================== */

    function addItem() {
      if (route.name !== 'list') return;
      if (form.processing) {
        showToast('Картинка ещё обрабатывается…');
        return;
      }

      const key = route.key;
      const s = SECTIONS[key];
      const textEl = $('#fText');
      const text = textEl.value.trim();

      if (!text && !form.image) {
        showToast(s.emptyRequired);
        textEl.focus();
        return;
      }

      const item = { id: uid(), text: text, done: false, created: Date.now(), image: form.image || null };

      if (s.price) {
        const raw = $('#fPrice').value.trim().replace(',', '.');
        const num = raw === '' ? null : Number(raw);
        item.price = (num === null || Number.isNaN(num)) ? null : num;
      }
      if (s.shop) item.shop = $('#fShop').value.trim();
      if (s.comment) item.comment = $('#fComment').value.trim();
      if (s.source) item.source = $('#fSource').value;
      if (s.date) item.date = $('#fDate').value || null;

      abortVoice();

      if (!mutate(() => data[key].unshift(item))) return;

      resetForm();
      renderItems();
      haptic('success');
    }

    function resetForm() {
      const ids = ['fText', 'fPrice', 'fShop', 'fComment', 'fSource', 'fDate'];
      ids.forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      ['fText', 'fComment'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.style.height = '';
      });
      setFormImage(null);
    }

    function toggleItem(key, id) {
      const item = findItem(key, id);
      if (!item) return;
      if (!mutate(() => { item.done = !item.done; })) return;
      haptic('light');
      renderItems();
    }

    function deleteItem(key, id) {
      const arr = data[key];
      const index = arr.findIndex((i) => i.id === id);
      if (index < 0) return;

      const removed = arr.splice(index, 1)[0];
      if (!saveData()) {
        arr.splice(index, 0, removed);
        return;
      }
      if (editingDateId === id) editingDateId = null;
      renderItems();
      haptic('light');

      /* Отмена удаления без блокирующих диалогов */
      showToast('Запись удалена', 'Вернуть', () => {
        if (data[key].some((i) => i.id === removed.id)) return;
        const pos = Math.min(index, data[key].length);
        if (!mutate(() => data[key].splice(pos, 0, removed))) return;
        if (route.name === 'list' && route.key === key) renderItems();
        else if (route.name !== 'list') render();
      }, 4500);
    }

    /* ----- Дата задачи ----- */

    function openDateEditor(id) {
      editingDateId = editingDateId === id ? null : id;
      renderItems();
      if (!editingDateId) return;

      const input = document.querySelector(`.item[data-id="${CSS.escape(id)}"] .date-edit-input`);
      if (!input) return;
      try {
        if (typeof input.showPicker === 'function') input.showPicker();
        else input.focus();
      } catch (e) {
        input.focus(); // showPicker может быть запрещён во встроенном окне
      }
    }

    /* Сохраняем дату без перерисовки, чтобы не закрыть системный пикер */
    function setTaskDate(id, value, inputEl) {
      const item = findItem('tasks', id);
      if (!item) return;
      if (!mutate(() => { item.date = value || null; })) {
        if (inputEl) inputEl.value = item.date || '';
        return;
      }
      const line = inputEl && inputEl.closest('.item') ? inputEl.closest('.item').querySelector('.due-line') : null;
      if (line) line.textContent = dueText(item);
    }

    function clearTaskDate(id) {
      const item = findItem('tasks', id);
      if (!item) return;
      if (!mutate(() => { item.date = null; })) return;
      editingDateId = null;
      renderItems();
      haptic('light');
    }

    function closeDateEditor() {
      editingDateId = null;
      renderItems(); // перераспределяем задачу по группам
    }

    /* =====================================================================
       КАРТИНКИ
       ===================================================================== */

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          try {
            const scale = Math.min(1, IMAGE_MAX_WIDTH / img.naturalWidth, IMAGE_MAX_HEIGHT / img.naturalHeight);
            const w = Math.max(1, Math.round(img.naturalWidth * scale));
            const h = Math.max(1, Math.round(img.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF'; // фон для PNG с прозрачностью
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(url);
            resolve(canvas.toDataURL('image/jpeg', IMAGE_QUALITY));
          } catch (err) {
            URL.revokeObjectURL(url);
            reject(err);
          }
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Не удалось прочитать картинку'));
        };

        img.src = url;
      });
    }

    async function handleImageInput(input) {
      const file = input.files && input.files[0];
      input.value = ''; // чтобы можно было выбрать тот же файл повторно
      if (!file) return;

      if (file.type && file.type.indexOf('image/') !== 0) {
        showToast('Это не картинка');
        return;
      }

      form.processing = true;
      try {
        const dataUrl = await compressImage(file);
        if (route.name === 'list') setFormImage(dataUrl);
      } catch (e) {
        showToast('Не удалось обработать картинку');
      } finally {
        form.processing = false;
      }
    }

    function setFormImage(dataUrl) {
      form.image = dataUrl;
      const preview = document.getElementById('fPreview');
      const img = document.getElementById('fPreviewImg');
      if (!preview || !img) return;
      if (dataUrl) {
        img.src = dataUrl;
        preview.classList.remove('hidden');
      } else {
        img.removeAttribute('src');
        preview.classList.add('hidden');
      }
    }

    /* ----- Полноэкранный просмотр ----- */

    function openViewer(src) {
      if (!isValidImage(src)) return;
      viewerImg.src = src;
      viewer.classList.remove('hidden');
      viewerOpen = true;
      updateBackButton();
    }

    function closeViewer() {
      viewer.classList.add('hidden');
      viewerImg.removeAttribute('src');
      viewerOpen = false;
      updateBackButton();
    }

    /* =====================================================================
       ГОЛОСОВОЙ ВВОД (Web Speech API)
       ===================================================================== */

    function updateVoiceBtn() {
      const btn = document.getElementById('voiceBtn');
      if (!btn) return;
      btn.classList.toggle('listening', listening);
      btn.textContent = listening ? '⏹ Стоп' : '🎤 Голосом';
    }

    function toggleVoice() {
      if (!voiceSupported) return;
      if (listening) {
        stopVoice();
        return;
      }

      const textarea = document.getElementById('fText');
      if (!textarea) return;
      const base = textarea.value.trim();

      try {
        recognition = new SpeechRecognitionAPI();
        recognition.lang = 'ru-RU';
        recognition.interimResults = true;
        recognition.continuous = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
          let transcript = '';
          for (let i = 0; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          textarea.value = (base ? base + ' ' : '') + transcript.trim();
          autoGrow(textarea);
        };

        recognition.onerror = (event) => {
          const messages = {
            'not-allowed': 'Нет доступа к микрофону',
            'service-not-allowed': 'Распознавание речи недоступно в этом приложении',
            'no-speech': 'Ничего не услышал, попробуйте ещё раз',
            'audio-capture': 'Микрофон не найден',
            'network': 'Нужен интернет для распознавания речи'
          };
          if (event.error !== 'aborted') {
            showToast(messages[event.error] || 'Ошибка распознавания речи');
          }
        };

        recognition.onend = () => {
          listening = false;
          recognition = null;
          updateVoiceBtn();
        };

        recognition.start();
        listening = true;
        updateVoiceBtn();
        haptic('light');
      } catch (e) {
        listening = false;
        recognition = null;
        updateVoiceBtn();
        showToast('Не удалось запустить распознавание речи');
      }
    }

    function stopVoice() {
      if (!recognition) return;
      try { recognition.stop(); } catch (e) { /* игнорируем */ }
    }

    function abortVoice() {
      if (!recognition) return;
      try { recognition.abort(); } catch (e) { /* игнорируем */ }
      recognition = null;
      listening = false;
    }

    /* =====================================================================
       ТОСТЫ
       ===================================================================== */

    function showToast(text, actionText, onAction, duration) {
      clearTimeout(toastTimer);
      toastTextEl.textContent = text;
      toastActionHandler = onAction || null;

      if (actionText && onAction) {
        toastActionEl.textContent = actionText;
        toastActionEl.classList.remove('hidden');
      } else {
        toastActionEl.classList.add('hidden');
      }

      toastEl.classList.remove('hidden');
      toastTimer = setTimeout(hideToast, duration || 2800);
    }

    function hideToast() {
      toastEl.classList.add('hidden');
      toastActionHandler = null;
    }

    /* =====================================================================
       ОБРАБОТЧИКИ СОБЫТИЙ
       ===================================================================== */

    function autoGrow(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 3 + 'px';
    }

    app.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;

      const action = el.dataset.action;
      const itemEl = el.closest('.item');
      const id = itemEl ? itemEl.dataset.id : null;
      const key = route.name === 'list' ? route.key : null;

      switch (action) {
        case 'back':
          goBack();
          break;
        case 'open-buy':
          navigate({ name: 'buy' });
          break;
        case 'open-list':
          if (SECTIONS[el.dataset.key]) navigate({ name: 'list', key: el.dataset.key });
          break;
        case 'voice':
          toggleVoice();
          break;
        case 'remove-form-image':
          setFormImage(null);
          break;
        case 'clear-form-date': {
          const d = document.getElementById('fDate');
          if (d) d.value = '';
          break;
        }
        case 'toggle':
          if (key && id) toggleItem(key, id);
          break;
        case 'delete':
          if (key && id) deleteItem(key, id);
          break;
        case 'view-image': {
          const item = key && id ? findItem(key, id) : null;
          if (item) openViewer(item.image);
          break;
        }
        case 'edit-date':
          if (id) openDateEditor(id);
          break;
        case 'clear-date':
          if (id) clearTaskDate(id);
          break;
        case 'close-date':
          closeDateEditor();
          break;
      }
    });

    app.addEventListener('submit', (e) => {
      if (e.target && e.target.id === 'addForm') {
        e.preventDefault();
        addItem();
      }
    });

    app.addEventListener('change', (e) => {
      const t = e.target;
      if (t.id === 'fImage') {
        handleImageInput(t);
      } else if (t.classList.contains('date-edit-input')) {
        const itemEl = t.closest('.item');
        if (itemEl) setTaskDate(itemEl.dataset.id, t.value, t);
      }
    });

    app.addEventListener('input', (e) => {
      if (e.target.tagName === 'TEXTAREA') autoGrow(e.target);
    });

    viewer.addEventListener('click', closeViewer);

    toastActionEl.addEventListener('click', () => {
      const handler = toastActionHandler;
      hideToast();
      clearTimeout(toastTimer);
      if (handler) handler();
    });

    /* Обновление счётчиков, если данные изменились в другой вкладке (в браузере) */
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) {
        data = loadData();
        if (route.name === 'list') renderItems();
        else render();
      }
    });

    /* =====================================================================
       ИНИЦИАЛИЗАЦИЯ TELEGRAM
       ===================================================================== */

    function initTelegram() {
      if (!tg) return;

      try {
        tg.ready();
        tg.expand();
      } catch (e) { /* вне Telegram — игнорируем */ }

      /* Фиксированная светлая тема по дизайну: белая шапка и фон */
      try {
        if (versionAtLeast('6.9')) tg.setHeaderColor('#FFFFFF');
        if (versionAtLeast('6.1')) tg.setBackgroundColor('#FFFFFF');
        if (versionAtLeast('7.10')) tg.setBottomBarColor('#FFFFFF');
      } catch (e) { /* игнорируем */ }

      /* Чтобы прокрутка списка не сворачивала приложение свайпом вниз */
      try {
        if (versionAtLeast('7.7')) tg.disableVerticalSwipes();
      } catch (e) { /* игнорируем */ }

      /* Системная кнопка «Назад» Telegram */
      try {
        if (versionAtLeast('6.1')) tg.BackButton.onClick(goBack);
      } catch (e) { /* игнорируем */ }
    }

    initTelegram();
    render();
  </script>
</body>
</html>
