    const viewer = document.getElementById('viewer');
    const viewerImg = document.getElementById('viewerImg');
    const viewerClose = document.getElementById('viewerClose');
    const toastEl = document.getElementById('toast');
    const toastTextEl = document.getElementById('toastText');
    const toastActionEl = document.getElementById('toastAction');

    /* =====================================================================
       УТИЛИТЫ
       ===================================================================== */

    function esc(value) {
      return String(value).replace(/[&<>"']/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function pad(n) {
      return String(n).padStart(2, '0');
    }

    function toISODate(d) {
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    }

    function todayISO() {
      return toISODate(new Date());
    }

    function tomorrowISO() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      return toISODate(d);
    }

    function formatCreated(ts) {
      const d = new Date(Number(ts) || Date.now());
      if (isNaN(d.getTime())) return '';
      return pad(d.getDate()) + '.' + pad(d.getMonth() + 1) + '.' + d.getFullYear() +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function formatCreatedShort(ts) {
      const d = new Date(Number(ts) || Date.now());
      if (isNaN(d.getTime())) return '';
      const date = d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
      return date + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function formatDue(iso) {
      const parts = String(iso || '').split('-').map(Number);
      if (parts.length !== 3 || parts.some(isNaN)) return '';
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      if (isNaN(d.getTime())) return '';
      const opts = { weekday: 'short', day: 'numeric', month: 'long' };
      if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
      return d.toLocaleDateString('ru-RU', opts);
    }

    function formatPrice(value) {
      return Number(value).toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' ₽';
    }

    /* Число из поля ввода: пусто или мусор → null. Понимает пробелы и запятую. */
    function parsePrice(raw) {
      const v = String(raw || '').trim().replace(/\s|\u00A0/g, '').replace(',', '.');
      if (!v) return null;
      const n = Number(v);
      return Number.isFinite(n) ? n : null;
    }

    function numValue(v) {
      return (v === null || v === undefined || v === '') ? '' : String(v);
    }

    function isValidImage(src) {
      return typeof src === 'string' && src.indexOf('data:image/') === 0;
    }

    /* Ссылка: добавляем https:// при необходимости, пропускаем только http/https */
    function normalizeLink(value) {
      let v = String(value || '').trim();
      if (!v) return '';
      if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
      try {
        const u = new URL(v);
        return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '';
      } catch (e) {
        return '';
      }
    }

    /* Первая ссылка из текста (с обрезкой хвостовой пунктуации) */
    function extractLink(text) {
      const m = String(text || '').match(/https?:\/\/[^\s<>"']+/i);
      if (!m) return '';
      const cleaned = m[0].replace(/[.,;:!?\]\)\}]+$/, '');
      return normalizeLink(cleaned);
    }

    function linkHost(url) {
      try {
        return new URL(url).hostname.replace(/^www\./, '');
      } catch (e) {
        return url;
      }
    }

    function versionAtLeast(v) {
      try {
        return !!(tg && typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast(v));
      } catch (e) {
        return false;
      }
    }

    function haptic(type) {
      if (!versionAtLeast('6.1') || !tg.HapticFeedback) return;
      try {
        if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
        else tg.HapticFeedback.impactOccurred('light');
      } catch (e) { /* вибро недоступно */ }
    }

    function getFirstName() {
      try {
        const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
        return user && user.first_name ? String(user.first_name) : '';
      } catch (e) {
        return '';
      }
    }

    function escapeSelector(value) {
      if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(value);
      return String(value).replace(/["\\]/g, '\\$&');
    }

    /* Открыть ссылку: t.me — внутри Telegram, остальные — во внешнем браузере */
    function openExternal(url) {
      if (!/^https?:\/\//i.test(url)) return;
      try {
        if (tg && /^https:\/\/t\.me\//i.test(url) && versionAtLeast('6.1')) {
          tg.openTelegramLink(url);
          return;
        }
        if (tg && typeof tg.openLink === 'function') {
          tg.openLink(url);
          return;
        }
      } catch (e) { /* ниже — запасной вариант */ }
      window.open(url, '_blank', 'noopener');
    }

    /* =====================================================================
       ХРАНИЛИЩЕ (localStorage)
       ===================================================================== */

    /* Приводим запись к актуальному виду (в том числе старые данные) */
    function normalizeItem(item) {
      if (!item || typeof item !== 'object') return item;
      if (!item.id) item.id = uid();
      if (!item.updatedAt) item.updatedAt = Number(item.created) || Date.now();
      if (typeof item.done !== 'boolean') item.done = false;
      if (item.done) {
        if (!item.doneAt) item.doneAt = Date.now();
      } else {
        item.doneAt = null;
      }
      return item;
    }

    function loadData() {
      let parsed = {};
      try {
        parsed = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
      } catch (e) {
        parsed = {};
      }
      if (typeof parsed !== 'object' || parsed === null) parsed = {};
      LIST_KEYS.forEach((k) => {
        if (!Array.isArray(parsed[k])) parsed[k] = [];
        parsed[k] = parsed[k].filter((it) => it && typeof it === 'object');
        parsed[k].forEach(normalizeItem);
      });
      /* Старые записи Фудсити: раньше «Цена» и была ценой за ящик */
      parsed.buy_foodcity.forEach((it) => {
        if (it.priceBox === undefined) {
          it.priceBox = (typeof it.price === 'number') ? it.price : null;
        }
      });
      return parsed;
    }

    function isQuotaError(e) {
      return !!e && (
        e.name === 'QuotaExceededError' ||
        e.name === 'NS_ERROR_DOM_QUOTA_REACHED' ||
        e.code === 22 ||
        e.code === 1014
      );
    }

    function saveData(opts) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        scheduleTaskSync();
        if (!opts || !opts.noSync) scheduleSync(400);
        return true;
      } catch (e) {
        if (isQuotaError(e)) {
          showToast('Память заполнена. Удалите старые записи или картинки.', null, null, 5000);
        } else {
          showToast('Не удалось сохранить данные на устройстве', null, null, 5000);
        }
        return false;
      }
    }

    /* Изменение данных с откатом, если сохранение не удалось */
    function mutate(fn) {
      const backup = JSON.stringify(data);
      const backupPending = new Map(sync.pending);
      const backupDeleted = sync.deleted.slice();
      fn();
      if (!saveData()) {
        data = JSON.parse(backup);
        sync.pending = backupPending;
        sync.deleted = backupDeleted;
        saveSyncMeta();
        saveDeleted();
        return false;
      }
      return true;
    }

    function findItem(key, id) {
      return (data[key] || []).find((i) => i.id === id) || null;
    }

    function activeCount(keys) {
      return keys.reduce((sum, k) => sum + (data[k] || []).filter((i) => !i.done).length, 0);
    }

    /* =====================================================================
       НАВИГАЦИЯ
       ===================================================================== */

    function navigate(newRoute) {
      abortVoice();
      clearTimeout(searchTimer);
      if (viewerOpen) closeViewer();
      editingDateId = null;
      editingItemId = null;
      searchQuery = '';
      filterMode = 'all';
      expandedIds = new Set();
      form = { image: null, processing: false };
      route = newRoute;
      render();
      window.scrollTo(0, 0);
    }

    function goBack() {
      if (viewerOpen) {
        closeViewer();
        return;
      }
      if (route.name === 'list') {
        const parent = SECTIONS[route.key].parent;
        navigate(parent === 'buy' ? { name: 'buy' } : { name: 'home' });
      } else if (route.name === 'buy') {
        navigate({ name: 'home' });
      }
    }

    function updateBackButton() {
      if (!versionAtLeast('6.1') || !tg.BackButton) return;
      try {
        if (route.name !== 'home' || viewerOpen) tg.BackButton.show();
        else tg.BackButton.hide();
      } catch (e) { /* игнорируем */ }
    }

    /* =====================================================================
       РЕНДЕР ЭКРАНОВ
       ===================================================================== */

    function render() {
      if (route.name === 'home') {
        app.innerHTML = renderHome();
      } else if (route.name === 'buy') {
        app.innerHTML = renderBuy();
      } else {
        app.innerHTML = renderListScreen(route.key);
        renderItems();
      }
      updateBackButton();
      updateSyncLine();
    }

    function menuCardHTML(card) {
      const n = activeCount(card.keys);
      return `
        <button class="menu-card" type="button" data-action="${card.action}" data-key="${esc(card.key)}">
          <span class="menu-icon" aria-hidden="true">${icon(card.icon)}</span>
          <span class="menu-main">
            <span class="menu-title">${esc(card.title)}</span>
            <span class="menu-sub">${esc(card.sub || '')}</span>
          </span>
          ${n ? `<span class="badge" aria-label="Активных: ${n}">${n > 99 ? '99+' : n}</span>` : ''}
          <span class="chev" aria-hidden="true">${icon('chevron')}</span>
        </button>`;
    }

    function topbarHTML(title, count, liveId) {
      return `
        <header class="topbar">
          <button class="round-btn" type="button" data-action="back" aria-label="Назад">${icon('arrowLeft')}</button>
          <h1 class="topbar-title">${esc(title)}</h1>
          ${liveId
            ? `<span class="count-pill ${count ? '' : 'zero'}" id="listCount" aria-label="Записей: ${count}">${count}</span>`
            : (count ? `<span class="count-pill">${count}</span>` : '')}
        </header>`;
    }

    function tipHTML(iconName, text) {
      return `<div class="tip">${icon(iconName)}<span>${esc(text)}</span></div>`;
    }

    function renderHome() {
      const name = getFirstName();
      return `
        <div class="screen">
          <header class="home-head">
            <div class="brand">
              <span class="brand-mark" aria-hidden="true">${icon('checkSmall')}</span>
              <span class="brand-name">Списки</span>
            </div>
            <h1 class="hero">Привет${name ? ', ' + esc(name) : ''}!</h1>
            <p class="hero-sub">Личные списки, заметки и планы</p>
            <div class="sync-line hidden" id="syncLine" role="status" aria-live="polite"></div>
          </header>
          <div class="cards">
            ${HOME_CARDS.map(menuCardHTML).join('')}
          </div>
        </div>`;
    }

    function renderBuy() {
      const count = (data.buy_foodcity || []).length + (data.buy_shops || []).length;
      return `
        <div class="screen">
          ${topbarHTML('Что купить', count, false)}
          <p class="section-sub">Выбери, где будешь покупать</p>
          <div class="cards">
            ${BUY_CARDS.map(menuCardHTML).join('')}
          </div>
        </div>`;
    }

    function sourceOptionsHTML(selected) {
      const list = SOURCES.slice();
      if (selected && list.indexOf(selected) === -1) list.unshift(selected);
      return ['<option value="">Не указано</option>']
        .concat(list.map((src) => `<option value="${esc(src)}"${src === selected ? ' selected' : ''}>${esc(src)}</option>`))
        .join('');
    }

    function renderListScreen(key) {
      const s = SECTIONS[key];
      const isNotes = !!s.noCheck;
      const count = (data[key] || []).length;
      const filterHTML = isNotes ? '' : `
        <div class="segmented" role="group" aria-label="Фильтр записей">
          <button class="seg ${filterMode === 'all' ? 'active' : ''}" type="button" data-action="filter" data-value="all" aria-pressed="${filterMode === 'all'}">Все</button>
          <button class="seg ${filterMode === 'active' ? 'active' : ''}" type="button" data-action="filter" data-value="active" aria-pressed="${filterMode === 'active'}">Активные</button>
          <button class="seg ${filterMode === 'done' ? 'active' : ''}" type="button" data-action="filter" data-value="done" aria-pressed="${filterMode === 'done'}">Готово</button>
        </div>`;

      return `
        <div class="screen">
          ${topbarHTML(s.title, count, true)}
          <div class="sync-line hidden" id="syncLine" role="status" aria-live="polite"></div>

          ${s.link && serverEnabled() ? tipHTML('send', 'Перешли боту ссылку на фильм или сериал — она появится здесь. Остальные сообщения станут заметками.') : ''}
          ${s.noCheck && serverEnabled() ? tipHTML('send', 'Ссылка на кино — в «Что смотреть», всё остальное — сюда.') : ''}
          ${s.date && serverEnabled() ? tipHTML('bell', 'Бот напомнит в Telegram за день до даты, в 10:00.') : ''}

          <form class="composer" id="addForm" autocomplete="off" novalidate>
            <label class="visually-hidden" for="fText">${esc(s.textLabel)}</label>
            <textarea id="fText" rows="2" placeholder="${esc(s.placeholder)}"></textarea>

            ${s.link ? `
            <label class="field">
              <span class="label">Ссылка (необязательно)</span>
              <input id="fLink" type="url" inputmode="url" placeholder="https://…" autocomplete="off" enterkeyhint="done">
            </label>` : ''}

            ${s.price ? `
            <label class="field">
              <span class="label">Цена, ₽</span>
              <input id="fPrice" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0" enterkeyhint="done">
            </label>` : ''}

            ${s.boxPrice ? `
            <label class="field">
              <span class="label">Цена за ящик, ₽</span>
              <input id="fPriceBox" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0" enterkeyhint="done">
            </label>` : ''}

            ${s.shop ? `
            <label class="field">
              <span class="label">Магазин</span>
              <input id="fShop" type="text" placeholder="Например: Пятёрочка" enterkeyhint="done">
            </label>` : ''}

            ${s.comment ? `
            <label class="field">
              <span class="label">Комментарий</span>
              <textarea id="fComment" rows="2" placeholder="Необязательно"></textarea>
            </label>` : ''}

            ${s.source ? `
            <label class="field">
              <span class="label">Кто посоветовал</span>
              <span class="select-wrap"><select id="fSource">${sourceOptionsHTML('')}</select></span>
            </label>` : ''}

            ${s.date ? `
            <div class="field">
              <label class="label" for="fDate">Дата (необязательно)</label>
              <div class="date-row">
                <input id="fDate" type="date">
                <button class="date-clear" type="button" data-action="clear-form-date">Без даты</button>
              </div>
            </div>` : ''}

            <div class="preview hidden" id="fPreview">
              <img id="fPreviewImg" alt="Прикреплённая картинка">
              <button class="preview-remove" type="button" data-action="remove-form-image" aria-label="Убрать картинку">${icon('x')}</button>
            </div>

            <div class="composer-actions">
              ${voiceSupported ? `<button class="tool-btn" type="button" id="voiceBtn" data-action="voice" aria-label="Ввести голосом">${icon('mic')}</button>` : ''}
              <button class="tool-btn" type="button" data-action="pick-image" aria-label="Добавить картинку">${icon('image')}</button>
              <input id="fImage" class="visually-hidden" type="file" accept="image/*" tabindex="-1">
              <button class="add-btn" type="submit">${icon('plus')}<span>Добавить</span></button>
            </div>
          </form>

          <div class="list-tools">
            <div class="search">
              ${icon('search')}
              <input id="fSearch" type="search" placeholder="Поиск по записям" value="${esc(searchQuery)}" autocomplete="off" enterkeyhint="search" aria-label="Поиск по записям">
            </div>
            ${filterHTML}
          </div>

          ${s.price ? '<div class="total hidden" id="total"></div>' : ''}
          <div id="items" class="items"></div>
        </div>`;
    }

    /* =====================================================================
       РЕНДЕР ЗАПИСЕЙ
       ===================================================================== */

    function dueLabel(item) {
      if (!item.date) return 'Без даты';
      const overdue = !item.done && item.date < todayISO();
      return formatDue(item.date) + (overdue ? ' · просрочено' : '');
    }

    /* Карточка в режиме редактирования */
    function editItemHTML(item, s) {
      const link = item.link || '';
      return `
        <div class="item editing" data-id="${esc(item.id)}">
          <div class="edit-form">
            <label class="field">
              <span class="label">${esc(s.textLabel)}</span>
              <textarea class="e-text" rows="3">${esc(item.text || '')}</textarea>
            </label>

            ${(s.link || s.autoLink) ? `
            <label class="field">
              <span class="label">Ссылка</span>
              <input class="e-link" type="url" inputmode="url" placeholder="https://…" value="${esc(link)}">
            </label>` : ''}

            ${s.price ? `
            <label class="field">
              <span class="label">Цена, ₽</span>
              <input class="e-price" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0" value="${esc(numValue(item.price))}">
            </label>` : ''}

            ${s.boxPrice ? `
            <label class="field">
              <span class="label">Цена за ящик, ₽</span>
              <input class="e-priceBox" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0" value="${esc(numValue(item.priceBox))}">
            </label>` : ''}

            ${s.shop ? `
            <label class="field">
              <span class="label">Магазин</span>
              <input class="e-shop" type="text" placeholder="Например: Пятёрочка" value="${esc(item.shop || '')}">
            </label>` : ''}

            ${s.factFields ? `
            <label class="field">
              <span class="label">Цена факт, ₽</span>
              <input class="e-priceFact" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0" value="${esc(numValue(item.priceFact))}">
            </label>
            <label class="field">
              <span class="label">Место</span>
              <input class="e-place" type="text" placeholder="Где купил" value="${esc(item.place || '')}">
            </label>` : ''}

            ${s.comment ? `
            <label class="field">
              <span class="label">Комментарий</span>
              <textarea class="e-comment" rows="2" placeholder="Необязательно">${esc(item.comment || '')}</textarea>
            </label>` : ''}

            ${s.source ? `
            <label class="field">
              <span class="label">Кто посоветовал</span>
              <span class="select-wrap"><select class="e-source">${sourceOptionsHTML(item.source || '')}</select></span>
            </label>` : ''}

            <div class="edit-actions">
              <button class="btn save" type="button" data-action="save-edit">Сохранить</button>
              <button class="btn ghost" type="button" data-action="cancel-edit">Отмена</button>
            </div>
          </div>
        </div>`;
    }

    function itemHTML(item, key) {
      const s = SECTIONS[key];
      if (s.editable && editingItemId === item.id) return editItemHTML(item, s);

      const doneLabel = s.doneLabel || 'выполнено';
      const text = item.text || '';
      const isLong = text.length > 280 || text.split('\n').length > 6;
      const expanded = expandedIds.has(item.id);
      const chips = [];

      if (s.price && typeof item.price === 'number') {
        chips.push(`<span class="chip accent">${esc(formatPrice(item.price))}</span>`);
      }
      if (s.boxPrice && typeof item.priceBox === 'number') {
        chips.push(`<span class="chip">${icon('box')}За ящик: ${esc(formatPrice(item.priceBox))}</span>`);
      }
      if (s.shop && item.shop) {
        chips.push(`<span class="chip">${esc(item.shop)}</span>`);
      }
      if (s.source && item.source) {
        chips.push(`<span class="chip">${icon('user')}${esc(item.source)}</span>`);
      }
      if (s.date) {
        const overdue = !item.done && item.date && item.date < todayISO();
        chips.push(`<span class="chip ${overdue ? 'danger' : ''}">${icon('calendar')}${esc(dueLabel(item))}</span>`);
      }

      const lines = [];
      if (text) {
        lines.push(`<div class="item-text ${isLong && !expanded ? 'clamp' : ''}">${esc(text)}</div>`);
        if (isLong) {
          lines.push(`<button class="more-btn" type="button" data-action="toggle-expand">${expanded ? 'Свернуть' : 'Показать полностью'}</button>`);
        }
      }
      if (chips.length) lines.push(`<div class="chips">${chips.join('')}</div>`);
      if (item.comment) lines.push(`<p class="item-comment">${esc(item.comment)}</p>`);

      if (item.link) {
        lines.push(`<button class="link-chip" type="button" data-action="open-link">${icon('link')}<span>${esc(linkHost(item.link))}</span></button>`);
      }

      if (isValidImage(item.image)) {
        lines.push(`<button class="thumb" type="button" data-action="view-image" aria-label="Открыть картинку"><img src="${esc(item.image)}" alt="Картинка" loading="lazy"></button>`);
      }

      if (s.factFields) {
        lines.push(`
          <div class="fact-row">
            <label class="mini-field">
              <span class="label">Цена факт</span>
              <input class="fact-input" data-field="priceFact" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0" value="${esc(numValue(item.priceFact))}">
            </label>
            <label class="mini-field">
              <span class="label">Место</span>
              <input class="fact-input" data-field="place" type="text" placeholder="Где купил" value="${esc(item.place || '')}">
            </label>
          </div>`);
      }

      if (s.date && editingDateId === item.id) {
        lines.push(`
          <div class="date-edit">
            <input class="date-edit-input" type="date" value="${esc(item.date || '')}" aria-label="Дата задачи">
            <button class="btn small ghost" type="button" data-action="clear-date">Без даты</button>
            <button class="btn small ghost" type="button" data-action="close-date">Готово</button>
          </div>`);
      }

      lines.push(`
        <footer class="item-foot">
          <span class="item-date" title="${esc(formatCreated(item.created))}">${esc(formatCreatedShort(item.created))}</span>
          <div class="item-actions">
            ${s.editable ? `<button class="icon-btn" type="button" data-action="edit-item" aria-label="Редактировать">${icon('pencil')}</button>` : ''}
            ${s.date ? `<button class="icon-btn" type="button" data-action="edit-date" aria-label="Изменить дату">${icon('calendar')}</button>` : ''}
            <button class="icon-btn danger" type="button" data-action="delete" aria-label="Удалить">${icon('trash')}</button>
          </div>
        </footer>`);

      return `
        <article class="item ${item.done ? 'done' : ''} ${s.noCheck ? 'no-check' : ''}" data-id="${esc(item.id)}">
          ${s.noCheck ? '' : `
          <button class="check" type="button" data-action="toggle" role="checkbox"
                  aria-checked="${item.done ? 'true' : 'false'}"
                  aria-label="${item.done ? 'Снять отметку' : 'Отметить как ' + esc(doneLabel)}">
            <span class="box">${item.done ? icon('checkSmall') : ''}</span>
          </button>`}
          <div class="item-main">${lines.join('')}</div>
        </article>`;
    }

    function sortItems(arr) {
      return arr.slice().sort((a, b) => (Number(a.done) - Number(b.done)) || (b.created - a.created));
    }

    function itemMatches(item, q) {
      const hay = [
        item.text, item.comment, item.shop, item.source, item.place, item.link,
        typeof item.price === 'number' ? formatPrice(item.price) : '',
        typeof item.priceBox === 'number' ? formatPrice(item.priceBox) : ''
      ].filter(Boolean).join(' ').toLowerCase();
      return hay.indexOf(q) !== -1;
    }

    /* Итоги по ценам: для Фудсити «К покупке» считаем по цене за ящик */
    function updateTotals() {
      if (route.name !== 'list') return;
      const s = SECTIONS[route.key];
      const totalEl = document.getElementById('total');
      if (!s.price || !totalEl) return;

      const items = data[route.key] || [];
      const parts = [];
      let plan = 0;
      let planLabel = 'К покупке';

      if (s.boxPrice) {
        plan = items
          .filter((i) => !i.done)
          .map((i) => (typeof i.priceBox === 'number' ? i.priceBox : i.price))
          .filter((v) => typeof v === 'number')
          .reduce((acc, v) => acc + v, 0);
        planLabel = 'К покупке (ящики)';
      } else {
        plan = items
          .filter((i) => !i.done && typeof i.price === 'number')
          .reduce((acc, i) => acc + i.price, 0);
      }

      if (plan > 0) {
        parts.push(`<div class="total-item"><span class="total-label">${esc(planLabel)}</span><span class="total-value">${esc(formatPrice(plan))}</span></div>`);
      }

      if (s.factFields) {
        const fact = items
          .filter((i) => typeof i.priceFact === 'number')
          .reduce((acc, i) => acc + i.priceFact, 0);
        if (fact > 0) {
          parts.push(`<div class="total-item fact"><span class="total-label">Факт</span><span class="total-value">${esc(formatPrice(fact))}</span></div>`);
        }
      }

      totalEl.innerHTML = parts.join('');
      totalEl.classList.toggle('hidden', !parts.length);
    }

    function updateCount(value) {
      const el = document.getElementById('listCount');
      if (!el || route.name !== 'list') return;
      const n = typeof value === 'number' ? value : 0;
      el.textContent = String(n);
      el.classList.toggle('zero', n === 0);
      el.setAttribute('aria-label', 'Записей: ' + n);
    }

    function emptyHTML(key, filtered) {
      if (filtered) {
        return `
          <div class="empty">
            <div class="empty-ic">${icon('search')}</div>
            <p class="empty-title">Ничего не найдено</p>
            <p class="empty-text">Попробуй изменить запрос или фильтр</p>
            <button class="btn small ghost" type="button" data-action="reset-filters">Сбросить фильтры</button>
          </div>`;
      }
      return `
        <div class="empty">
          <div class="empty-ic">${icon(SECTIONS[key].icon)}</div>
          <p class="empty-title">Пока пусто</p>
          <p class="empty-text">Добавь первую запись — она появится здесь</p>
        </div>`;
    }

    function renderItems() {
      const container = document.getElementById('items');
      if (!container || route.name !== 'list') return;

      const key = route.key;
      const s = SECTIONS[key];
      updateTotals();

      let items = (data[key] || []).slice();
      const q = searchQuery.trim().toLowerCase();

      if (q) items = items.filter((i) => itemMatches(i, q));
      if (!s.noCheck && filterMode === 'active') items = items.filter((i) => !i.done);
      if (!s.noCheck && filterMode === 'done') items = items.filter((i) => i.done);

      updateCount(items.length);

      if (!items.length) {
        const noData = !(data[key] || []).length;
        container.innerHTML = emptyHTML(key, !noData);
        return;
      }

      if (!s.date) {
        container.innerHTML = sortItems(items).map((i) => itemHTML(i, key)).join('');
        return;
      }

      /* Группировка задач */
      const today = todayISO();
      const tomorrow = tomorrowISO();
      const groups = { overdue: [], today: [], tomorrow: [], later: [], nodate: [], done: [] };

      items.forEach((item) => {
        if (item.done) groups.done.push(item);
        else if (!item.date) groups.nodate.push(item);
        else if (item.date < today) groups.overdue.push(item);
        else if (item.date === today) groups.today.push(item);
        else if (item.date === tomorrow) groups.tomorrow.push(item);
        else groups.later.push(item);
      });

      const byDate = (a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : b.created - a.created);
      const byCreated = (a, b) => b.created - a.created;
      groups.overdue.sort(byDate);
      groups.today.sort(byDate);
      groups.tomorrow.sort(byCreated);
      groups.later.sort(byDate);
      groups.nodate.sort(byCreated);
      groups.done.sort(byCreated);

      const order = [
        ['overdue', 'Просрочено', 'overdue'],
        ['today', 'Сегодня', ''],
        ['tomorrow', 'Завтра', ''],
        ['later', 'Позже', ''],
        ['nodate', 'Без даты', ''],
        ['done', 'Выполнено', '']
      ];

      container.innerHTML = order
        .filter(([g]) => groups[g].length)
        .map(([g, title, cls]) => `<div class="group-title ${cls}">${title}</div>` +
          groups[g].map((i) => itemHTML(i, key)).join(''))
        .join('');
    }

    /* =====================================================================
       ДЕЙСТВИЯ СО СПИСКОМ
       ===================================================================== */

    function addItem() {
      if (route.name !== 'list') return;
      if (form.processing) {
        showToast('Картинка ещё обрабатывается…');
        return;
      }

      const key = route.key;
      const s = SECTIONS[key];
      const textEl = document.getElementById('fText');
      const text = textEl ? textEl.value.trim() : '';
      let link = '';

      if (s.link) {
        const linkEl = document.getElementById('fLink');
        link = normalizeLink(linkEl ? linkEl.value : '') || extractLink(text);
      }
      if (s.autoLink) link = extractLink(text);

      if (!text && !form.image && !link) {
        showToast(s.emptyRequired);
        if (textEl) textEl.focus();
        return;
      }

      const item = { id: uid(), text: text, done: false, doneAt: null, created: Date.now(), updatedAt: Date.now(), image: form.image || null };

      const valueOf = (id) => {
        const el = document.getElementById(id);
        return el ? el.value : '';
      };

      if (s.price) item.price = parsePrice(valueOf('fPrice'));
      if (s.boxPrice) item.priceBox = parsePrice(valueOf('fPriceBox'));
      if (s.shop) item.shop = valueOf('fShop').trim();
      if (s.comment) item.comment = valueOf('fComment').trim();
      if (s.factFields) { item.priceFact = null; item.place = ''; }
      if (s.link || s.autoLink) item.link = link;
      if (s.source) item.source = valueOf('fSource');
      if (s.date) item.date = valueOf('fDate') || null;

      abortVoice();

      if (!mutate(() => {
        data[key].unshift(item);
        touchItem(key, item);
      })) return;

      clearListFilters();
      resetForm();
      renderItems();
      haptic('success');
    }

    /* После добавления показываем всю ленту, чтобы новая запись не «пропала» из-за фильтра */
    function clearListFilters() {
      clearTimeout(searchTimer);
      searchQuery = '';
      filterMode = 'all';

      const searchEl = document.getElementById('fSearch');
      if (searchEl) searchEl.value = '';

      document.querySelectorAll('.seg').forEach((b) => {
        const on = b.dataset.value === 'all';
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', String(on));
      });
    }

    function resetForm() {
      const ids = ['fText', 'fLink', 'fPrice', 'fPriceBox', 'fShop', 'fComment', 'fSource', 'fDate'];
      ids.forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.value = '';
      });
      ['fText', 'fComment'].forEach((id) => {
        const el = document.getElementById(id);
        if (el) el.style.height = '';
      });
      setFormImage(null);
    }

    function toggleItem(key, id) {
      const item = findItem(key, id);
      if (!item) return;
      if (!mutate(() => {
        item.done = !item.done;
        item.doneAt = item.done ? Date.now() : null;
        touchItem(key, item);
      })) return;
      haptic('light');
      renderItems();
    }

    function deleteItem(key, id) {
      const arr = data[key] || [];
      const index = arr.findIndex((i) => i.id === id);
      if (index < 0) return;

      const removed = arr.splice(index, 1)[0];
      if (!saveData()) {
        arr.splice(index, 0, removed);
        return;
      }
      queueDelete(key, id);
      scheduleSync(300);
      if (editingDateId === id) editingDateId = null;
      if (editingItemId === id) editingItemId = null;
      renderItems();
      haptic('light');

      /* Отмена удаления без блокирующих диалогов */
      showToast('Запись удалена', 'Вернуть', () => {
        if ((data[key] || []).some((i) => i.id === removed.id)) return;
        const pos = Math.min(index, data[key].length);
        if (!mutate(() => {
          data[key].splice(pos, 0, removed);
          sync.deleted = sync.deleted.filter((d) => d.id !== removed.id);
          saveDeleted();
          touchItem(key, removed);
        })) return;
        if (route.name === 'list' && route.key === key) renderItems();
        else if (route.name !== 'list') render();
      }, 4500);
    }

    /* ----- Редактирование записи ----- */

    function openEditor(id) {
      editingItemId = id;
      editingDateId = null;
      renderItems();
      const card = document.querySelector(`.item[data-id="${escapeSelector(id)}"]`);
      if (!card) return;
      card.querySelectorAll('textarea').forEach(autoGrow);
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function saveEdit(id, card) {
      const key = route.key;
      const s = SECTIONS[key];
      const item = findItem(key, id);
      if (!item || !card) return;

      const textEl = card.querySelector('.e-text');
      const text = textEl ? textEl.value.trim() : '';
      if (!text && !item.image) {
        showToast(s.emptyRequired);
        if (textEl) textEl.focus();
        return;
      }

      const valueOf = (sel) => {
        const el = card.querySelector(sel);
        return el ? el.value : '';
      };

      const patch = { text: text };

      if (s.link || s.autoLink) {
        patch.link = normalizeLink(valueOf('.e-link')) || extractLink(text);
      }
      if (s.price) patch.price = parsePrice(valueOf('.e-price'));
      if (s.boxPrice) patch.priceBox = parsePrice(valueOf('.e-priceBox'));
      if (s.shop) patch.shop = valueOf('.e-shop').trim();
      if (s.comment) patch.comment = valueOf('.e-comment').trim();
      if (s.source) patch.source = valueOf('.e-source');
      if (s.factFields) {
        patch.priceFact = parsePrice(valueOf('.e-priceFact'));
        patch.place = valueOf('.e-place').trim();
      }

      const ok = mutate(() => {
        Object.assign(item, patch);
        touchItem(key, item);
      });
      if (!ok) return;

      editingItemId = null;
      renderItems();
      haptic('success');
      showToast('Сохранено');
    }

    function cancelEdit() {
      editingItemId = null;
      renderItems();
    }

    /* Быстрое сохранение «Цена факт» / «Место» прямо из карточки */
    function setFact(id, field, inputEl) {
      if (route.name !== 'list') return;
      const item = findItem(route.key, id);
      if (!item) return;
      const prev = item[field];
      const value = field === 'priceFact' ? parsePrice(inputEl.value) : inputEl.value.trim();
      if (!mutate(() => {
        item[field] = value;
        touchItem(route.key, item);
      })) {
        inputEl.value = field === 'priceFact' ? numValue(prev) : (prev || '');
        return;
      }
      updateTotals();
    }

    /* ----- Дата задачи ----- */

    function openDateEditor(id) {
      editingDateId = editingDateId === id ? null : id;
      renderItems();
      if (!editingDateId) return;

      const input = document.querySelector(`.item[data-id="${escapeSelector(id)}"] .date-edit-input`);
      if (!input) return;
      try {
        if (typeof input.showPicker === 'function') input.showPicker();
        else input.focus();
      } catch (e) {
        input.focus();
      }
    }

    function setTaskDate(id, value) {
      const item = findItem('tasks', id);
      if (!item) return;
      if (!mutate(() => {
        item.date = value || null;
        touchItem('tasks', item);
      })) return;
      editingDateId = null;
      renderItems();
      haptic('light');
    }

    function clearTaskDate(id) {
      const item = findItem('tasks', id);
      if (!item) return;
      if (!mutate(() => {
        item.date = null;
        touchItem('tasks', item);
      })) return;
      editingDateId = null;
      renderItems();
      haptic('light');
    }

    function closeDateEditor() {
      editingDateId = null;
      renderItems();
    }

    /* ----- Поиск / фильтры / разворачивание ----- */

    function setFilter(value) {
      if (value !== 'all' && value !== 'active' && value !== 'done') return;
      filterMode = value;
      document.querySelectorAll('.seg').forEach((b) => {
        const on = b.dataset.value === value;
        b.classList.toggle('active', on);
        b.setAttribute('aria-pressed', String(on));
      });
      renderItems();
    }

    function resetFilters() {
      searchQuery = '';
      filterMode = 'all';
      render();
    }

    function toggleExpand(id) {
      if (expandedIds.has(id)) expandedIds.delete(id);
      else expandedIds.add(id);
      renderItems();
    }

    /* =====================================================================
       КАРТИНКИ
       ===================================================================== */

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();

        img.onload = () => {
          try {
            const scale = Math.min(1, IMAGE_MAX_WIDTH / img.naturalWidth, IMAGE_MAX_HEIGHT / img.naturalHeight);
            const w = Math.max(1, Math.round(img.naturalWidth * scale));
            const h = Math.max(1, Math.round(img.naturalHeight * scale));
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, w, h);
            ctx.drawImage(img, 0, 0, w, h);
            URL.revokeObjectURL(url);
            resolve(canvas.toDataURL('image/jpeg', IMAGE_QUALITY));
          } catch (err) {
            URL.revokeObjectURL(url);
            reject(err);
          }
        };

        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Не удалось прочитать картинку'));
        };

        img.src = url;
      });
    }

    async function handleImageInput(input) {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file) return;

      if (file.type && file.type.indexOf('image/') !== 0) {
        showToast('Это не картинка');
        return;
      }

      const routeKey = route.name === 'list' ? route.key : null;
      form.processing = true;
      try {
        const dataUrl = await compressImage(file);
        if (route.name === 'list' && route.key === routeKey) setFormImage(dataUrl);
      } catch (e) {
        showToast('Не удалось обработать картинку');
      } finally {
        form.processing = false;
      }
    }

    function setFormImage(dataUrl) {
      form.image = dataUrl;
      const preview = document.getElementById('fPreview');
      const img = document.getElementById('fPreviewImg');
      if (!preview || !img) return;
      if (dataUrl) {
        img.src = dataUrl;
        preview.classList.remove('hidden');
      } else {
        img.removeAttribute('src');
        preview.classList.add('hidden');
      }
    }

    function openViewer(src) {
      if (!isValidImage(src)) return;
      viewerImg.src = src;
      viewer.classList.remove('hidden');
      viewerOpen = true;
      document.body.classList.add('is-locked');
      updateBackButton();
    }

    function closeViewer() {
      viewer.classList.add('hidden');
      viewerImg.removeAttribute('src');
      viewerOpen = false;
      document.body.classList.remove('is-locked');
      updateBackButton();
    }

    /* =====================================================================
       ГОЛОСОВОЙ ВВОД (Web Speech API)
       ===================================================================== */

    function updateVoiceBtn() {
      const btn = document.getElementById('voiceBtn');
      if (!btn) return;
      btn.classList.toggle('listening', listening);
      btn.innerHTML = listening ? icon('stop') : icon('mic');
      btn.setAttribute('aria-label', listening ? 'Остановить запись' : 'Ввести голосом');
    }

    function toggleVoice() {
      if (!voiceSupported) return;
      if (listening) {
        stopVoice();
        return;
      }

      const textarea = document.getElementById('fText');
      if (!textarea) return;
      const base = textarea.value.trim();

      try {
        recognition = new SpeechRecognitionAPI();
        recognition.lang = 'ru-RU';
        recognition.interimResults = true;
        recognition.continuous = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
          let transcript = '';
          for (let i = 0; i < event.results.length; i++) {
            transcript += event.results[i][0].transcript;
          }
          textarea.value = (base ? base + ' ' : '') + transcript.trim();
          autoGrow(textarea);
        };

        recognition.onerror = (event) => {
          const messages = {
            'not-allowed': 'Нет доступа к микрофону',
            'service-not-allowed': 'Распознавание речи недоступно в этом приложении',
            'no-speech': 'Ничего не услышал, попробуйте ещё раз',
            'audio-capture': 'Микрофон не найден',
            'network': 'Нужен интернет для распознавания речи'
          };
          if (event.error !== 'aborted') {
            showToast(messages[event.error] || 'Ошибка распознавания речи');
          }
        };

        recognition.onend = () => {
          listening = false;
          recognition = null;
          updateVoiceBtn();
        };

        recognition.start();
        listening = true;
        updateVoiceBtn();
        haptic('light');
      } catch (e) {
        listening = false;
        recognition = null;
        updateVoiceBtn();
        showToast('Не удалось запустить распознавание речи');
      }
    }

    function stopVoice() {
      if (!recognition) return;
      try { recognition.stop(); } catch (e) { /* игнорируем */ }
    }

    function abortVoice() {
      const rec = recognition;
      recognition = null;
      listening = false;
      if (rec) {
        try { rec.abort(); } catch (e) { /* игнорируем */ }
      }
      updateVoiceBtn();
    }

    /* =====================================================================
       СВЯЗЬ С СЕРВЕРОМ БОТА
       ===================================================================== */

    function serverEnabled() {
      return !!API_URL && !!(tg && tg.initData);
    }

    /* text/plain — чтобы браузер не делал лишний CORS-запрос OPTIONS */
    async function api(path, body, timeoutMs) {
      const payload = Object.assign({ initData: tg ? tg.initData : '' }, body || {});
      const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), timeoutMs || 12000) : null;

      try {
        const res = await fetch(API_URL.replace(/\/+$/, '') + path, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify(payload),
          signal: controller ? controller.signal : undefined
        });
        if (!res.ok) {
          let detail = null;
          try { detail = await res.json(); } catch (e) { detail = null; }
          const err = new Error('HTTP ' + res.status);
          err.status = res.status;
          err.detail = detail;
          throw err;
        }
        return await res.json();
      } finally {
        if (timer) clearTimeout(timer);
      }
    }

    function looksLikeMovieLink(url) {
      try {
        const u = new URL(url);
        const host = u.hostname.replace(/^www\./i, '').toLowerCase();
        const path = u.pathname.toLowerCase();
        if (MOVIE_HOSTS.some((h) => host === h || host.slice(-(h.length + 1)) === '.' + h)) return true;
        if (MOVIE_URL_RE.test(host)) return true;
        if (MOVIE_PATH_RE.test(path)) return true;
        return false;
      } catch (e) {
        return false;
      }
    }

    /* Куда положить пересланное боту сообщение */
    function inboxTarget(it) {
      const declared = String(it.target || it.list || it.folder || it.type || '').toLowerCase();
      if (/note|замет/.test(declared)) return 'notes';
      if (/watch|movie|film|кино|смотреть/.test(declared)) return 'watch';

      const text = String(it.text || '');
      const link = normalizeLink(it.link || '') || extractLink(text);
      if (!link) return 'notes';
      if (INBOX_RULE === 'movie') {
        return (looksLikeMovieLink(link) || MOVIE_WORDS.test(text)) ? 'watch' : 'notes';
      }
      return 'watch';
    }

    /* Забрать пересланные боту сообщения и разложить по спискам */
    async function pullInbox() {
      if (!serverEnabled() || inboxBusy) return;
      inboxBusy = true;
      try {
        const res = await api('/api/inbox', {}, 12000);
        const items = Array.isArray(res.items) ? res.items : [];
        if (!items.length) return;

        const buckets = { watch: [], notes: [] };

        items.forEach((it) => {
          if (!it || typeof it.id !== 'string') return;
          if (data.watch.some((w) => w.id === it.id) || data.notes.some((n) => n.id === it.id)) return;

          const target = inboxTarget(it);
          const text = String(it.text || '');
          buckets[target].push({
            id: it.id,
            text: text.slice(0, 4000),
            link: normalizeLink(it.link || '') || extractLink(text),
            image: isValidImage(it.image) ? it.image : null,
            done: false,
            doneAt: null,
            created: Number(it.created) || Date.now(),
            updatedAt: Date.now()
          });
        });

        const total = buckets.watch.length + buckets.notes.length;
        if (total) {
          let ok = mutate(() => {
            if (buckets.watch.length) {
              data.watch.unshift(...buckets.watch);
              buckets.watch.forEach((f) => touchItem('watch', f));
            }
            if (buckets.notes.length) {
              data.notes.unshift(...buckets.notes);
              buckets.notes.forEach((f) => touchItem('notes', f));
            }
          });

          if (!ok) {
            /* Не хватило памяти — пробуем сохранить без картинок */
            buckets.watch.forEach((f) => { f.image = null; });
            buckets.notes.forEach((f) => { f.image = null; });
            ok = mutate(() => {
              if (buckets.watch.length) {
                data.watch.unshift(...buckets.watch);
                buckets.watch.forEach((f) => touchItem('watch', f));
              }
              if (buckets.notes.length) {
                data.notes.unshift(...buckets.notes);
                buckets.notes.forEach((f) => touchItem('notes', f));
              }
            });
          }
          if (!ok) return; // не подтверждаем — попробуем при следующем открытии

          const parts = [];
          if (buckets.watch.length) {
            parts.push(buckets.watch.length + ' в «Что смотреть»');
          }
          if (buckets.notes.length) {
            parts.push(buckets.notes.length + ' в «Заметки»');
          }
          showToast('📥 Из бота: ' + parts.join(', '), null, null, 4000);

          if (route.name === 'list' && (route.key === 'watch' || route.key === 'notes')) renderItems();
          else if (route.name === 'home' || route.name === 'buy') render();
        }

        await api('/api/inbox/ack', { ids: items.map((i) => i.id) }, 12000);
      } catch (e) {
        /* сервер недоступен или таймаут — попробуем позже */
      } finally {
        inboxBusy = false;
      }
    }

    /* Задачи с датой для напоминаний: только текст и дата */
    function tasksPayload() {
      return (data.tasks || [])
        .filter((t) => !t.done && t.date)
        .map((t) => ({ id: t.id, text: (t.text || 'Задача с картинкой').slice(0, 300), date: t.date }));
    }

    function scheduleTaskSync() {
      if (!serverEnabled()) return;
      clearTimeout(taskSyncTimer);
      taskSyncTimer = setTimeout(syncTasks, 1500);
    }

    async function syncTasks() {
      if (!serverEnabled()) return;
      let tz = '';
      try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { tz = ''; }

      const body = { tasks: tasksPayload(), tz: tz, offset: new Date().getTimezoneOffset() };
      const signature = JSON.stringify(body);
      let last = null;
      try { last = localStorage.getItem(SYNC_KEY); } catch (e) { last = null; }
      if (signature === last) return; // ничего не изменилось — не тратим запросы

      try {
        await api('/api/tasks', body, 12000);
        try { localStorage.setItem(SYNC_KEY, signature); } catch (e) { /* не критично */ }
      } catch (e) {
        /* повторим при следующем изменении или открытии */
      }
    }

    /* =====================================================================
       ОБЩАЯ БАЗА: СИНХРОНИЗАЦИЯ СПИСКОВ
       ===================================================================== */

    function loadDeleted() {
      let raw = null;
      try { raw = JSON.parse(localStorage.getItem(DELETED_KEY) || '[]'); } catch (e) { raw = []; }
      if (!Array.isArray(raw)) return [];
      const ttl = 60 * 24 * 60 * 60 * 1000;
      const now = Date.now();
      return raw
        .filter((d) => d && typeof d.key === 'string' && typeof d.id === 'string')
        .filter((d) => !d.ts || now - Number(d.ts) < ttl)
        .map((d) => ({ key: d.key, id: d.id, ts: Number(d.ts) || now }));
    }

    function saveDeleted() {
      try { localStorage.setItem(DELETED_KEY, JSON.stringify(sync.deleted)); } catch (e) { /* не критично */ }
    }

    function loadSyncMeta() {
      try {
        const meta = JSON.parse(localStorage.getItem(SYNC_META_KEY) || '{}');
        return meta && typeof meta === 'object' ? meta : {};
      } catch (e) {
        return {};
      }
    }

    function saveSyncMeta() {
      try {
        localStorage.setItem(SYNC_META_KEY, JSON.stringify({
          version: SYNC_VERSION,
          since: sync.since,
          bootstrapped: sync.bootstrapped,
          pending: Array.from(sync.pending.entries()).map(([id, rec]) => ({
            id: id, key: rec.key, updatedAt: rec.updatedAt
          }))
        }));
      } catch (e) { /* не критично */ }
    }

    /* Помечаем запись изменённой: новое время + очередь на отправку */
    function touchItem(key, item) {
      if (!item || typeof item !== 'object') return;
      item.updatedAt = Math.max(Date.now(), (Number(item.updatedAt) || 0) + 1);
      sync.pending.set(item.id, { key: key, updatedAt: item.updatedAt });
      saveSyncMeta();
    }

    function queueDelete(key, id) {
      sync.pending.delete(id);
      if (!sync.deleted.some((d) => d.id === id)) {
        sync.deleted.push({ key: key, id: id, ts: Date.now() });
        saveDeleted();
      }
      saveSyncMeta();
    }

    function findItemAnywhere(id) {
      for (let i = 0; i < LIST_KEYS.length; i++) {
        const found = data[LIST_KEYS[i]].find((it) => it.id === id);
        if (found) return { key: LIST_KEYS[i], item: found };
      }
      return null;
    }

    /* Что отправить: очередь изменённых записей */
    function collectPush() {
      const put = [];
      sync.pending.forEach((rec, id) => {
        const item = findItem(rec.key, id);
        if (!item) { sync.pending.delete(id); return; }
        put.push({ key: rec.key, item: JSON.parse(JSON.stringify(item)) });
      });
      return put;
    }

    /* Первый обмен: отправляем все локальные записи, чтобы списки слились */
    function collectAllItems() {
      const put = [];
      LIST_KEYS.forEach((key) => {
        data[key].forEach((item) => put.push({ key: key, item: JSON.parse(JSON.stringify(item)) }));
      });
      return put;
    }

    function syncStatusText() {
      if (!serverEnabled()) return 'Списки хранятся на этом телефоне';
      if (sync.authFailed) return 'Общая база: нет доступа';
      if (sync.error === 'server_not_ready') return 'Общая база не включена на сервере';
      if (sync.error) return 'Нет связи — изменения отправятся позже';
      if (sync.ready) return 'Общая база включена';
      return 'Подключение к общей базе…';
    }

    function updateSyncLine() {
      const el = document.getElementById('syncLine');
      if (!el) return;
      const text = syncStatusText();
      el.textContent = text;
      el.classList.toggle('hidden', !text);
      el.classList.toggle('warn', !!(sync.authFailed || sync.error));
    }

    function scheduleSync(delay) {
      if (!serverEnabled()) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(syncLists, typeof delay === 'number' ? delay : 500);
    }

    /* Отправка блоками: большие картинки не должны упираться в лимит запроса */
    function splitPuts(puts) {
      const chunks = [];
      let cur = [];
      let size = 0;
      puts.forEach((entry) => {
        const len = JSON.stringify(entry).length + 1;
        if (cur.length && size + len > SYNC_CHUNK_CHARS) {
          chunks.push(cur);
          cur = [];
          size = 0;
        }
        cur.push(entry);
        size += len;
      });
      if (cur.length) chunks.push(cur);
      return chunks;
    }

    function stripImagesFor(ids) {
      let stripped = false;
      ids.forEach((id) => {
        const found = findItemAnywhere(id);
        if (found && found.item.image) {
          found.item.image = null;
          touchItem(found.key, found.item);
          stripped = true;
        }
      });
      return stripped;
    }

    async function syncLists() {
      if (!serverEnabled() || sync.busy || sync.authFailed) return;
      sync.busy = true;
      try {
        const bootstrap = !sync.bootstrapped;
        const chunks = splitPuts(bootstrap ? collectAllItems() : collectPush());
        const dels = sync.deleted.map((d) => ({ key: d.key, id: d.id }));
        if (!chunks.length) chunks.push([]);

        for (let i = 0; i < chunks.length; i++) {
          const last = i === chunks.length - 1;
          const res = await api('/api/lists', {
            since: sync.since,
            put: chunks[i],
            del: last ? dels : []
          }, 20000);
          if (!res || res.ok === false) throw new Error((res && res.error) || 'sync_failed');
          applyServerState(res);
        }

        sync.ready = true;
        sync.bootstrapped = true;
        sync.error = '';
        sync.lastOk = Date.now();
        saveSyncMeta();
        updateSyncLine();

        /* Пока шёл запрос, могли появиться новые изменения — отправим следом */
        if (sync.pending.size || sync.deleted.length) scheduleSync(400);
      } catch (e) {
        sync.error = (e && e.message) || 'sync_failed';
        if (e && (e.status === 401 || e.status === 403)) sync.authFailed = true;
        if (e && e.status === 404) sync.error = 'server_not_ready';
        if (e && e.status === 413 && e.detail && Array.isArray(e.detail.ids)) {
          if (stripImagesFor(e.detail.ids)) {
            if (saveData({ noSync: true })) scheduleSync(600);
            showToast('Картинка слишком большая для общей базы — сохранено без неё');
          }
        }
        updateSyncLine();
      } finally {
        sync.busy = false;
      }
    }

    /* Применяем ответ сервера: слияние по updatedAt, удаления, подтверждения */
    function applyServerState(res) {
      if (!res || typeof res !== 'object') return;
      let changed = false;
      const incomingIds = [];

      (Array.isArray(res.items) ? res.items : []).forEach((entry) => {
        if (!entry || !SECTIONS[entry.key] || !entry.item || typeof entry.item.id !== 'string') return;
        const item = normalizeItem(Object.assign({}, entry.item));
        if (entry.key === 'buy_foodcity' && item.priceBox === undefined) {
          item.priceBox = (typeof item.price === 'number') ? item.price : null;
        }
        const arr = data[entry.key];
        const cur = arr.find((x) => x.id === item.id);
        if (!cur) {
          arr.push(item);
          sync.pending.delete(item.id);
          incomingIds.push(item.id);
          changed = true;
        } else if ((Number(item.updatedAt) || 0) > (Number(cur.updatedAt) || 0)) {
          Object.assign(cur, item);
          sync.pending.delete(item.id);
          changed = true;
        }
      });

      (Array.isArray(res.deleted) ? res.deleted : []).forEach((entry) => {
        if (!entry || !SECTIONS[entry.key]) return;
        const arr = data[entry.key];
        const idx = arr.findIndex((x) => x.id === entry.id);
        if (idx >= 0) { arr.splice(idx, 1); changed = true; }
        sync.pending.delete(entry.id);
        const before = sync.deleted.length;
        sync.deleted = sync.deleted.filter((d) => d.id !== entry.id);
        if (sync.deleted.length !== before) saveDeleted();
        if (editingItemId === entry.id) editingItemId = null;
        if (editingDateId === entry.id) editingDateId = null;
      });

      (Array.isArray(res.ack) ? res.ack : []).forEach((a) => {
        if (!a || typeof a.id !== 'string') return;
        const p = sync.pending.get(a.id);
        if (p && p.updatedAt === a.updatedAt) {
          sync.pending.delete(a.id);
          saveSyncMeta();
        }
      });

      (Array.isArray(res.delAck) ? res.delAck : []).forEach((d) => {
        if (!d || typeof d.id !== 'string') return;
        const before = sync.deleted.length;
        sync.deleted = sync.deleted.filter((x) => x.id !== d.id);
        if (sync.deleted.length !== before) saveDeleted();
      });

      const rev = Number(res.rev);
      if (Number.isFinite(rev)) sync.since = rev;

      if (!changed) return;

      if (!saveData({ noSync: true })) {
        /* Не хватило памяти — убираем картинки у пришедших записей */
        let freed = false;
        incomingIds.forEach((id) => {
          const found = findItemAnywhere(id);
          if (found && found.item.image) { found.item.image = null; freed = true; }
        });
        if (freed && !saveData({ noSync: true })) {
          showToast('Память заполнена — не удалось сохранить чужие изменения', null, null, 5000);
        }
      }

      /* Не сбиваем ввод: если пользователь печатает или редактирует — обновим позже */
      if (route.name === 'list') {
        const ae = document.activeElement;
        const typing = ae && app.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
        if (typing || editingItemId) { pendingRemoteRender = true; return; }
        renderItems();
      } else if (route.name === 'home' || route.name === 'buy') {
        render();
      }
    }

    /* Через сутки отметка «куплено» снимается сама — и у второго тоже */
    function expireDoneItems() {
      const now = Date.now();
      let changed = false;
      LIST_KEYS.forEach((key) => {
        data[key].forEach((item) => {
          if (item.done && item.doneAt && now - Number(item.doneAt) >= DONE_TTL_MS) {
            item.done = false;
            item.doneAt = null;
            touchItem(key, item);
            changed = true;
          }
        });
      });
      if (!changed) return;
      if (!saveData()) return;
      scheduleSync(200);
      if (route.name === 'list') renderItems();
      else render();
    }

    function initSync() {
      updateSyncLine();
      if (!serverEnabled()) return;
      sync.timer = setInterval(() => {
        if (document.visibilityState !== 'visible') return;
        expireDoneItems();
        syncLists();
      }, SYNC_POLL_MS);
      syncLists();
    }

    /* =====================================================================
       ТОСТЫ
       ===================================================================== */

    function showToast(text, actionText, onAction, duration) {
      clearTimeout(toastTimer);
      toastTextEl.textContent = text;
      toastActionHandler = onAction || null;

      if (actionText && onAction) {
        toastActionEl.textContent = actionText;
        toastActionEl.classList.remove('hidden');
      } else {
        toastActionEl.classList.add('hidden');
      }

      toastEl.classList.remove('hidden');
      toastTimer = setTimeout(hideToast, duration || 2800);
    }

    function hideToast() {
      toastEl.classList.add('hidden');
      toastActionHandler = null;
    }

    /* =====================================================================
       ОБРАБОТЧИКИ СОБЫТИЙ
       ===================================================================== */

    function autoGrow(el) {
      el.style.height = 'auto';
      el.style.height = el.scrollHeight + 3 + 'px';
    }

    app.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (!el) return;

      const action = el.dataset.action;
      const itemEl = el.closest('.item');
      const id = itemEl ? itemEl.dataset.id : null;
      const key = route.name === 'list' ? route.key : null;

      switch (action) {
        case 'back':
          goBack();
          break;
        case 'open-buy':
          navigate({ name: 'buy' });
          break;
        case 'open-list':
          if (SECTIONS[el.dataset.key]) navigate({ name: 'list', key: el.dataset.key });
          break;
        case 'voice':
          toggleVoice();
          break;
        case 'pick-image': {
          const input = document.getElementById('fImage');
          if (input) input.click();
          break;
        }
        case 'remove-form-image':
          setFormImage(null);
          break;
        case 'clear-form-date': {
          const d = document.getElementById('fDate');
          if (d) d.value = '';
          break;
        }
        case 'filter':
          setFilter(el.dataset.value);
          break;
        case 'reset-filters':
          resetFilters();
          break;
        case 'toggle':
          if (key && id) toggleItem(key, id);
          break;
        case 'delete':
          if (key && id) deleteItem(key, id);
          break;
        case 'toggle-expand':
          if (id) toggleExpand(id);
          break;
        case 'view-image': {
          const item = key && id ? findItem(key, id) : null;
          if (item) openViewer(item.image);
          break;
        }
        case 'open-link': {
          const item = key && id ? findItem(key, id) : null;
          if (item && item.link) openExternal(item.link);
          break;
        }
        case 'edit-item':
          if (id) openEditor(id);
          break;
        case 'save-edit':
          if (id) saveEdit(id, itemEl);
          break;
        case 'cancel-edit':
          cancelEdit();
          break;
        case 'edit-date':
          if (id) openDateEditor(id);
          break;
        case 'clear-date':
          if (id) clearTaskDate(id);
          break;
        case 'close-date':
          closeDateEditor();
          break;
      }
    });

    app.addEventListener('submit', (e) => {
      if (e.target && e.target.id === 'addForm') {
        e.preventDefault();
        addItem();
      }
    });

    app.addEventListener('change', (e) => {
      const t = e.target;
      if (t.id === 'fImage') {
        handleImageInput(t);
      } else if (t.classList.contains('date-edit-input')) {
        const itemEl = t.closest('.item');
        if (itemEl) setTaskDate(itemEl.dataset.id, t.value);
      } else if (t.classList.contains('fact-input')) {
        const itemEl = t.closest('.item');
        if (itemEl) setFact(itemEl.dataset.id, t.dataset.field, t);
      }
    });

    app.addEventListener('input', (e) => {
      if (e.target.id === 'fSearch') {
        searchQuery = e.target.value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(renderItems, 90);
        return;
      }
      if (e.target.tagName === 'TEXTAREA') autoGrow(e.target);
    });

    app.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        const formEl = e.target.closest && e.target.closest('#addForm');
        if (formEl) {
          e.preventDefault();
          addItem();
        }
        return;
      }
      if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('fact-input')) {
        e.preventDefault();
        e.target.blur();
      }
    });

    /* Отложенный показ чужих изменений, если они пришли во время ввода */
    app.addEventListener('focusout', () => {
      setTimeout(() => {
        if (!pendingRemoteRender) return;
        const ae = document.activeElement;
        const typing = ae && app.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
        if (typing || editingItemId) return;
        pendingRemoteRender = false;
        if (route.name === 'list') renderItems();
      }, 0);
    });

    viewer.addEventListener('click', (e) => {
      if (e.target === viewer) closeViewer();
    });
    viewerClose.addEventListener('click', closeViewer);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && viewerOpen) closeViewer();
    });

    toastActionEl.addEventListener('click', () => {
      const handler = toastActionHandler;
      hideToast();
      clearTimeout(toastTimer);
      if (handler) handler();
    });

    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) {
        data = loadData();
        if (route.name === 'list') renderItems();
        else render();
      }
    });

    /* При возврате в приложение — проверяем общую базу и новые сообщения */
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        expireDoneItems();
        syncLists();
        pullInbox();
        syncTasks();
      }
    });

    /* =====================================================================
       ИНИЦИАЛИЗАЦИЯ TELEGRAM
       ===================================================================== */

    function initTelegram() {
      if (!tg) return;

      try {
        tg.ready();
        tg.expand();
      } catch (e) { /* вне Telegram */ }

      try {
        if (versionAtLeast('6.9')) tg.setHeaderColor('#FFFFFF');
        if (versionAtLeast('6.1')) tg.setBackgroundColor('#FFFFFF');
        if (versionAtLeast('7.10')) tg.setBottomBarColor('#FFFFFF');
      } catch (e) { /* игнорируем */ }

      try {
        if (versionAtLeast('7.7')) tg.disableVerticalSwipes();
      } catch (e) { /* игнорируем */ }

      try {
        if (versionAtLeast('6.1')) tg.BackButton.onClick(goBack);
      } catch (e) { /* игнорируем */ }
    }

    initTelegram();
    /* Сохраняем нормализованные старые данные (миграция) и включаем общую базу */
    saveData({ noSync: true });
    render();
    expireDoneItems();
    initSync();
    pullInbox();
    syncTasks();
  </script>
</body>
</html>
